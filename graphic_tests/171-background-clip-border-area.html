<!DOCTYPE html>
<!-- CSS Backgrounds L4 §3.8 — `background-clip: border-area`: фон виден только там, где нарисована рамка (рамка прозрачная, поэтому фон под ней виден; внутри padding box фона нет).
     A: линейный градиент, сплошная рамка 30px · B: цвет + border-radius 50px (скруглённое кольцо) · C: разные радиусы углов (20/80) и градиент ·
     D: разные ширины сторон (4/16/40/8) и градиент · E: два слоя (градиент + цвет) с разным clip: border-area / padding-box · F: эталон border-box (фон под всем боксом).
     Текста нет: видны только фоны и рамки. -->
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #ff00ff; width: 1024px; height: 720px; margin: 0; padding: 0; }
  .__f { background: #ffffff; width: 1022px; height: 718px; margin: 1px; padding: 24px; overflow: hidden; box-sizing: border-box; }
  .cell { float: left; width: 300px; height: 300px; margin: 0 16px 20px 0; }
  .b { width: 190px; height: 130px; margin: 0; border: 30px solid transparent; background-origin: border-box; background-repeat: no-repeat; }
  .a { background-image: linear-gradient(135deg, #c53030, #ecc94b 50%, #2b6cb0); background-clip: border-area; }
  .r { background-color: #2f855a; background-clip: border-area; border-radius: 50px; }
  .d { border-radius: 20px 80px 20px 80px; background-image: linear-gradient(90deg, #b794f4, #2b6cb0); background-clip: border-area; }
  .w { border-width: 4px 16px 40px 8px; background-image: linear-gradient(0deg, #dd6b20, #805ad5); background-clip: border-area; }
  .l { background-image: linear-gradient(90deg, #f6e05e, #ed64a6), linear-gradient(#38b2ac, #2c7a7b); background-clip: border-area, padding-box; background-size: 100% 100%; }
  .e { background-image: linear-gradient(135deg, #c53030, #ecc94b 50%, #2b6cb0); background-clip: border-box; }
</style>
</head>
<body>
  <div class="__f">
    <div class="cell"><div class="b a"></div></div>
    <div class="cell"><div class="b r"></div></div>
    <div class="cell"><div class="b d"></div></div>
    <div class="cell"><div class="b w"></div></div>
    <div class="cell"><div class="b l"></div></div>
    <div class="cell"><div class="b e"></div></div>
  </div>
</body>
</html>
