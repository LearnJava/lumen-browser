<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Lumen — 153 zoom</title>
    <style>
        body {
            background: #ff00ff;
            width: 1024px;
            height: 720px;
            margin: 0;
            padding: 0;
        }
        .__f {
            background: #f5f5f5;
            width: 1022px;
            height: 718px;
            margin: 1px;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            box-sizing: border-box;
        }
        .panel {
            background: #ffffff;
            border: 1px solid #999999;
            box-sizing: border-box;
            width: 248px;
            height: 232px;
            padding: 6px;
            overflow: hidden;
        }
        /* Every length here is absolute (px): `zoom` scales those, while a
           relative unit would resolve against an already-zoomed basis and so
           test a different code path (covered by the unit tests instead). */
        .box {
            box-sizing: border-box;
            width: 200px;
            height: 120px;
            border: 8px solid #2255cc;
            padding: 12px;
            background: #cc2222;
        }
        .box > i {
            display: block;
            width: 60px;
            height: 40px;
            margin-top: 8px;
            background: #22aa55;
        }

        /* A: the unzoomed reference — every other panel is this box scaled. */
        /* B: number form. C: percentage form — same factor, other syntax. */
        .half { zoom: 0.5; }
        .pct { zoom: 80%; }

        /* D: `zoom` compounds down the tree — 0.8 × 0.5 = 0.4 of A. */
        .outer { zoom: 0.8; }
        .inner { zoom: 0.5; }

        /* E: three stripes that must come out identical — `normal` contributes
           no scaling and an unparseable declaration is dropped, per CSS Syntax,
           instead of being read as some default factor. */
        .stripe {
            width: 140px;
            height: 40px;
            margin-bottom: 10px;
            background: #8833bb;
        }
        .s-normal { zoom: normal; }
        .s-bad { zoom: banana; }

        /* F: the shape real sites use `zoom` for — a fixed-width row that only
           fits its container once scaled. Percentages, gaps and margins follow
           the zoomed box, so the row lands inside the panel instead of
           overflowing it. */
        .row {
            zoom: 0.5;
            box-sizing: border-box;
            width: 440px;
            min-width: 440px;
            border: 6px solid #444444;
            padding: 10px;
            display: flex;
            gap: 20px;
            background: #ddaa00;
        }
        .row > u {
            display: block;
            width: 50%;
            height: 80px;
            background: #00a0a0;
        }
        .row > u.tall {
            height: 120px;
            margin-top: 20px;
            background: #ee7722;
        }
    </style>
</head>
<body>
<div class="__f">
    <div class="panel">
        <div class="box"><i></i></div>
    </div>
    <div class="panel">
        <div class="box half"><i></i></div>
    </div>
    <div class="panel">
        <div class="box pct"><i></i></div>
    </div>
    <div class="panel">
        <div class="outer">
            <div class="box inner"><i></i></div>
        </div>
    </div>
    <div class="panel">
        <div class="stripe"></div>
        <div class="stripe s-normal"></div>
        <div class="stripe s-bad"></div>
    </div>
    <div class="panel">
        <div class="row"><u></u><u class="tall"></u></div>
    </div>
</div>
</body>
</html>
