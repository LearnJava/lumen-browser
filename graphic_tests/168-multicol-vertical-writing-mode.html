<!DOCTYPE html>
<!-- MULTICOL-VERTICAL: multicol в вертикальном `writing-mode` (CSS Multicol L1 §3 + Writing Modes L3 §3).
     Колонки идут по inline-оси (физическая y), каждая длиной с контейнер по блочной оси (x); поток
     первой колонки начинается у края начала блока (справа у `vertical-rl`, слева у `vertical-lr`).
     A: vertical-rl, column-fill:auto, рамка и padding контейнера, gap по y ·
     B: vertical-lr, балансировка колонок при auto-ширине контейнера ·
     C: vertical-rl, column-span:all и принудительный break-before:column ·
     D: блок шире колонки режется между колонками (box-decoration-break: slice, скругление) ·
     E: column-span:all внутри обёртки (обёртка делится вокруг спаннера) ·
     F: вертикальные multicol-контейнеры как flex-элементы горизонтального ряда.
     Только цветные боксы, без текста. -->
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #ff00ff; width: 1024px; height: 720px; margin: 0; padding: 0; }
  .__f { background: #ffffff; width: 1022px; height: 718px; margin: 1px; padding: 12px; overflow: hidden; box-sizing: border-box; }
  .cell { position: absolute; width: 320px; height: 330px; }
  .a { left: 12px; top: 12px; } .b { left: 340px; top: 12px; } .c { left: 668px; top: 12px; }
  .d { left: 12px; top: 350px; } .e { left: 340px; top: 350px; } .f { left: 668px; top: 350px; }
  .m { background: #d8d8d8; column-gap: 10px; }
  .m div { background: #f55; }

  .a .m { writing-mode: vertical-rl; columns: 2; column-fill: auto; width: 150px; height: 300px; padding: 8px;
          border: 4px solid #888; box-sizing: border-box; }
  .a .m > div:nth-child(1) { width: 60px; }
  .a .m > div:nth-child(2) { width: 50px; background: #5a5; }
  .a .m > div:nth-child(3) { width: 40px; background: #55f; }
  .a .m > div:nth-child(4) { width: 70px; background: #fa0; }

  .b .m { writing-mode: vertical-lr; columns: 3; height: 240px; padding: 6px; margin: 10px; }
  .b .m > div { width: 30px; }
  .b .m > div:nth-child(2) { background: #5a5; }
  .b .m > div:nth-child(3) { background: #55f; }
  .b .m > div:nth-child(4) { background: #fa0; }
  .b .m > div:nth-child(5) { background: #0aa; }

  .c .m { writing-mode: vertical-rl; columns: 3; column-gap: 6px; column-fill: auto; width: 200px; height: 300px; }
  .c .m > div { width: 20px; }
  .c .m > div:nth-child(1) { column-span: all; width: 30px; background: #a0a; }
  .c .m > div:nth-child(3) { break-before: column; background: #5a5; width: 40px; }
  .c .m > div:nth-child(4) { break-before: column; background: #55f; width: 30px; }

  .d .m { writing-mode: vertical-lr; columns: 2; column-fill: auto; width: 100px; height: 300px; }
  .d .m > div { width: 160px; border: 6px solid #333; border-radius: 24px; background: #fc9; box-sizing: border-box; }
  .d .m > div > div { width: 33px; margin: 2px; }
  .d .m > div > div:nth-child(2) { background: #5a5; }
  .d .m > div > div:nth-child(3) { background: #55f; }
  .d .m > div > div:nth-child(4) { background: #fa0; }

  .e .m { writing-mode: vertical-rl; columns: 2; column-fill: auto; width: 140px; height: 280px; }
  .e .m > div > div { width: 40px; }
  .e .m > div > div:nth-child(1) { column-span: all; width: 20px; background: #a0a; }
  .e .m > div > div:nth-child(2) { background: #5a5; }
  .e .m > div > div:nth-child(3) { background: #55f; }

  .f .row { display: flex; gap: 10px; align-items: flex-start; }
  .f .m { writing-mode: vertical-rl; columns: 2; width: 70px; height: 250px; column-fill: auto; }
  .f .m > div { width: 35px; }
  .f .m > div:nth-child(2) { background: #5a5; }
  .f .m > div:nth-child(3) { background: #55f; width: 20px; }
  .f .m:last-child { writing-mode: vertical-lr; }
</style>
</head>
<body>
<div class="__f">
  <div class="cell a"><div class="m"><div></div><div></div><div></div><div></div></div></div>
  <div class="cell b"><div class="m"><div></div><div></div><div></div><div></div><div></div></div></div>
  <div class="cell c"><div class="m"><div></div><div></div><div></div><div></div></div></div>
  <div class="cell d"><div class="m"><div><div></div><div></div><div></div><div></div></div></div></div>
  <div class="cell e"><div class="m"><div><div></div><div></div><div></div></div></div></div>
  <div class="cell f"><div class="row"><div class="m"><div></div><div></div><div></div></div><div class="m"><div></div><div></div><div></div></div></div></div>
</div>
</body>
</html>
