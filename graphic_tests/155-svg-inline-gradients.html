<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST-155: inline SVG linearGradient/radialGradient fill (LIB-5)</title>
    <style>
        body {
            background: #ff00ff;
            width: 1024px;
            height: 720px;
            margin: 0;
            padding: 0;
        }
        .__f {
            background: white;
            width: 1022px;
            height: 718px;
            margin: 1px;
            padding: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .row {
            display: flex;
            gap: 20px;
        }
        .col {
            width: 200px;
        }
        .label {
            margin-top: 6px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="__f">
        <!-- LIB-5: <linearGradient>/<radialGradient> resolved from the DOM
             (fill="url(#id)") — the own SVG renderer had zero gradient
             support before this (ADR-027 §"model of paths/paints/gradients"). -->
        <div class="row">
            <div class="col">
                <svg width="200" height="120" viewBox="0 0 200 120">
                    <defs>
                        <linearGradient id="lg-h" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0" stop-color="#ff0000"/>
                            <stop offset="1" stop-color="#0000ff"/>
                        </linearGradient>
                    </defs>
                    <rect x="0" y="0" width="200" height="120" fill="url(#lg-h)"/>
                </svg>
                <div class="label">rect: linearGradient (horizontal)</div>
            </div>
            <div class="col">
                <svg width="200" height="120" viewBox="0 0 200 120">
                    <defs>
                        <radialGradient id="rg-1" cx="0.5" cy="0.5" r="0.5">
                            <stop offset="0%" stop-color="#ffff00"/>
                            <stop offset="100%" stop-color="#008000"/>
                        </radialGradient>
                    </defs>
                    <circle cx="100" cy="60" r="55" fill="url(#rg-1)"/>
                </svg>
                <div class="label">circle: radialGradient</div>
            </div>
            <div class="col">
                <svg width="200" height="120" viewBox="0 0 200 120">
                    <defs>
                        <linearGradient id="lg-v" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0" stop-color="#ff8800"/>
                            <stop offset="0.5" stop-color="#ff00ff"/>
                            <stop offset="1" stop-color="#0088ff"/>
                        </linearGradient>
                    </defs>
                    <path d="M100 5 L195 115 L5 115 Z" fill="url(#lg-v)"/>
                </svg>
                <div class="label">path: linearGradient (vertical, 3 stops)</div>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <svg width="200" height="120" viewBox="0 0 200 120">
                    <defs>
                        <linearGradient id="lg-us" gradientUnits="userSpaceOnUse" x1="20" y1="20" x2="180" y2="100">
                            <stop offset="0" stop-color="#00cccc"/>
                            <stop offset="1" stop-color="#000066"/>
                        </linearGradient>
                    </defs>
                    <rect x="20" y="20" width="160" height="80" rx="16" ry="16" fill="url(#lg-us)"/>
                </svg>
                <div class="label">rounded rect: userSpaceOnUse</div>
            </div>
            <div class="col">
                <svg width="200" height="120" viewBox="0 0 200 120">
                    <defs>
                        <linearGradient id="lg-fo" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0" stop-color="#ff0000" stop-opacity="1"/>
                            <stop offset="1" stop-color="#ff0000" stop-opacity="0"/>
                        </linearGradient>
                    </defs>
                    <rect x="0" y="0" width="200" height="120" fill="#0000ff"/>
                    <rect x="0" y="0" width="200" height="120" fill="url(#lg-fo)"/>
                </svg>
                <div class="label">fill-opacity via stop-opacity</div>
            </div>
            <div class="col">
                <svg width="200" height="120" viewBox="0 0 200 120">
                    <defs>
                        <linearGradient id="lg-g" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0" stop-color="#00ff00"/>
                            <stop offset="1" stop-color="#ff00aa"/>
                        </linearGradient>
                    </defs>
                    <g transform="rotate(15 100 60)">
                        <rect x="30" y="30" width="140" height="60" fill="url(#lg-g)"/>
                    </g>
                </svg>
                <div class="label">gradient inherited through &lt;g&gt;, rotated</div>
            </div>
        </div>
    </div>
</body>
</html>
