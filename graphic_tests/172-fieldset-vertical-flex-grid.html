<!DOCTYPE html>
<!-- HTML Rendering §15.3.13 + Writing Modes L3 §3 — `<fieldset>` с `display: flex` / `grid` в вертикальном
     `writing-mode`: legend стоит на границе блока-начала (справа у `vertical-rl`, слева у `vertical-lr`),
     рамка вырезана под ним, flex/grid-раскладка идёт в анонимном контейнере содержимого рядом с legend
     (legend не элемент).
     A: vertical-rl, flex (ряд по inline-оси) · B: vertical-lr, flex · C: vertical-rl, flex-direction: column
     (главная ось — блоковая) · D: vertical-rl, grid 2 строки по inline-оси · E: vertical-lr, grid ·
     F: vertical-rl, flex, legend внутри рамки (толще border) и justify-self: end.
     Только цветные боксы, без текста. -->
<html>
<head>
<meta charset="utf-8">
<style>
  body { background: #ff00ff; width: 1024px; height: 720px; margin: 0; padding: 0; }
  .__f { background: #ffffff; width: 1022px; height: 718px; margin: 1px; padding: 12px; overflow: hidden; box-sizing: border-box; }
  .cell { position: absolute; width: 320px; height: 330px; }
  .a { left: 12px; top: 12px; } .b { left: 340px; top: 12px; } .c { left: 668px; top: 12px; }
  .d { left: 12px; top: 350px; } .e { left: 340px; top: 350px; } .f { left: 668px; top: 350px; }
  .s { margin: 0; padding: 10px; border: solid 8px #2b6cb0; width: 250px; height: 290px; box-sizing: border-box; }
  .s legend { width: 26px; height: 90px; padding: 0; background: #ed8936; }
  .blk { background: #a8c8ec; }
  .blk2 { background: #8ab4e0; }

  .a .s { writing-mode: vertical-rl; display: flex; gap: 10px; }
  .a .blk { height: 60px; width: 50px; }
  .a .blk2 { height: 90px; width: 80px; }

  .b .s { writing-mode: vertical-lr; display: flex; gap: 10px; }
  .b .blk { height: 60px; width: 50px; }
  .b .blk2 { height: 90px; width: 80px; }

  .c .s { writing-mode: vertical-rl; display: flex; flex-direction: column; }
  .c .blk { width: 50px; height: 70px; }
  .c .blk2 { width: 80px; height: 40px; }

  .d .s { writing-mode: vertical-rl; display: grid; grid-template-rows: 90px 1fr; gap: 8px; }
  .d .blk, .d .blk2 { width: 40px; }

  .e .s { writing-mode: vertical-lr; display: grid; grid-template-rows: 1fr 1fr; gap: 6px; }
  .e .blk, .e .blk2 { width: 36px; }

  .f .s { writing-mode: vertical-rl; display: flex; gap: 8px; border-width: 24px; }
  .f .s legend { width: 12px; height: 70px; justify-self: end; }
  .f .blk { height: 60px; width: 50px; }
  .f .blk2 { height: 70px; width: 70px; }
</style>
</head>
<body>
<div class="__f">
  <div class="cell a"><fieldset class="s"><legend></legend><div class="blk"></div><div class="blk2"></div></fieldset></div>
  <div class="cell b"><fieldset class="s"><legend></legend><div class="blk"></div><div class="blk2"></div></fieldset></div>
  <div class="cell c"><fieldset class="s"><legend></legend><div class="blk"></div><div class="blk2"></div></fieldset></div>
  <div class="cell d"><fieldset class="s"><legend></legend><div class="blk"></div><div class="blk2"></div><div class="blk2"></div></fieldset></div>
  <div class="cell e"><fieldset class="s"><legend></legend><div class="blk"></div><div class="blk2"></div><div class="blk2"></div><div class="blk"></div></fieldset></div>
  <div class="cell f"><fieldset class="s"><legend></legend><div class="blk"></div><div class="blk2"></div><div class="blk"></div></fieldset></div>
</div>
</body>
</html>
