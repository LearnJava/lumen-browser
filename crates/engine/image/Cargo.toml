[package]
name = "lumen-image"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lumen: декодер растровых изображений (PNG, JPEG, WebP, GIF, AVIF, JPEG XL)"

[features]
# Enable AVIF decoding via `image`'s `avif-native` (dav1d + mp4parse).
# Without this feature: AVIF files are recognised by signature but return AvifError::Decode.
# GAP-avif срез 1 (2026-09-21): this used to map to `image`'s "avif" feature,
# which pulls only `ravif`/`rav1e` — an AV1 *encoder*, no decoder at all, so
# the flag never actually decoded anything regardless of the build host.
# "avif-native" is the real decode path.
avif = ["dep:image"]

[dependencies]
lumen-core.workspace = true
zune-jpeg = "0.5"
zune-png = "0.5"
zune-core = "0.5"
image-webp = "0.2"
png = "0.17"
gif = "0.14"
# Provisional: LZW-распаковка кадров GIF собственным циклом вместо
# `gif::FrameDecoder`, который зависает навсегда на кадре с оборванным потоком
# (BUG-787). Тот же weezl, что уже тянет `gif`, — новых транзитивных зависимостей нет.
# Trait-anchor: lumen_core::ext::ImageDecoder (единственная точка вызова —
# lumen_image::gif::lzw_decode_into).
# Graduation: уходит только вместе с `gif` — пока контейнер разбирает он,
# weezl в дереве в любом случае (docs/plan/tech-stack.md §5).
weezl = "0.1"
flate2.workspace = true
# Provisional: image 0.25 для AVIF-декодирования через dav1d+mp4parse (Phase 0).
# Trait-anchor: lumen_core::ext::ImageDecoder (AvifImageDecoder).
# Graduation: permanent когда AVIF станет обязательным форматом в pipeline.
# Не в дефолтной сборке (GAP-avif срез 1, 2026-09-21): единственный реальный
# декодер в `image` — feature "avif-native" (dav1d C через `dav1d-sys`).
# Без системного dav1d в pkg-config `dav1d-sys` клонирует videolan/dav1d по
# сети и собирает его meson+ninja (+nasm для SIMD) — сборка требует интернет
# посреди `cargo build`, что несовместимо с герметичной сборкой проекта, и
# meson/ninja не входят в toolchain Windows/MSVC по умолчанию. Чистого-Rust
# AV1-декодера с готовой обвязкой под AVIF-контейнер в экосистеме нет:
# `rav1d` (memory-safe порт dav1d) существует на crates.io, но публикует
# только `Dav1d*`-C-ABI, без safe Rust API — интеграция означала бы писать
# собственный демукс ISOBMFF (`avif-parse`, есть) + unsafe-обвязку над этим
# C-ABI, что by объём сопоставимо с отдельной задачей, а не срезом внутри
# этой. Остаётся за feature "avif", как и раньше — но теперь она реально
# декодирует при включении, а не молча падает как feature "avif" делала.
image = { version = "0.25", default-features = false, features = ["avif-native"], optional = true }
# Provisional: чистый-Rust JPEG XL декодер (GAP-avif срез 3, 2026-09-21).
# Trait-anchor: lumen_core::ext::ImageDecoder (JxlImageDecoder).
# Graduation: permanent — JPEG XL реальный веб-формат, как остальные в этом
# файле. Не optional/за фичей: без нативных зависимостей (проверено деревом
# `cargo tree`), не требует ни cmake/meson, ни nasm, ни сети при сборке —
# ровно то, чего не хватает AVIF-декодеру выше.
jxl-oxide = "0.12"
# ADR-027 (LIB-4): renders external SVG (`<img src=*.svg>`, `background-image:
# url(*.svg)`) — the own SVG-to-DisplayList path (`lumen-layout`/`lumen-paint`)
# draws zero `linearGradient`/`radialGradient`, `clipPath`, `mask`, `filter`,
# `pattern` or `marker` (ADR-027's own measurement).
# Trait-anchor: lumen_core::ext::ImageDecoder (single call site: svg::decode_svg,
# dispatched from decode_raw exactly like every other format here).
# Pinned to 0.44.0, not latest (0.48): its `tiny-skia` is 0.11.4, the exact
# version `lumen-paint`'s `cpu-render` feature already carries — a newer resvg
# would duplicate tiny-skia at a second version in every binary linking both.
# `text`/`system-fonts` stay off: text rendering needs a `fontdb::Database`,
# and seeding one from the host OS would make identical SVG bytes rasterize
# differently machine to machine (the graphic-test gate assumes the opposite).
# `raster-images` is required for nested `<image>` (decodes embedded
# JPEG/PNG/GIF/WebP at render time) and pulls its own `gif`/`image-webp`/
# `zune-jpeg` versions distinct from this crate's — acceptable duplication of
# small leaf decoders to keep the important one, tiny-skia, unified.
# Graduation: permanent — SVG is a spec format like the others in this file.
resvg = { version = "=0.44.0", default-features = false, features = ["raster-images"] }
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

# Политики проекта как машинные проверки — [workspace.lints] в корневом
# Cargo.toml, протокол docs/lint-policy.md.
[lints]
workspace = true
