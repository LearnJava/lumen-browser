[package]
name = "lumen-paint"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lumen: display list and rasterization"

[dependencies]
lumen-core.workspace = true
lumen-dom.workspace = true
lumen-layout.workspace = true
lumen-font.workspace = true
lumen-image.workspace = true

# Exception #1 + #2 из §5: wgpu-surface привязан к winit-окну; оба опциональны
# и гейтируются фичей backend-wgpu (ADR-010).
winit = { workspace = true, optional = true }

# femtovg + glutin — Phase 2 default rendering backend (ADR-010 RB-9).
# Why this dependency: femtovg is a stable 2D GPU renderer (OpenGL ES 2.0) that covers
# every DisplayCommand natively (paths, gradients, text, clips, layers). It eliminates
# hand-written WGSL shaders. Promoted to permanent tier as Phase 2 default (RB-9).
# glutin provides cross-platform OpenGL context creation; glutin-winit bridges glutin
# with winit 0.30 windows.
femtovg = { version = "0.9", optional = true, default-features = false, features = ["debug_inspector"] }
glutin = { version = "0.32", optional = true }
glutin-winit = { version = "0.5", optional = true }
# imgref and rgb are direct deps of femtovg 0.9; we use them to pass image data to Canvas.
imgref = { version = "1.10", optional = true }
rgb = { version = "0.8", optional = true }

# CPU-рендеринг для детерминистичных тестов без GPU (8A.5)
tiny-skia = { version = "0.11", optional = true }
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

# Графический бэкенд wgpu выбирается per-target: workspace.dependencies не умеет
# `[target.'cfg(...)'.dependencies]`, поэтому набор `features` (какой GPU API
# компилируется внутрь wgpu) живёт здесь, а не в корневом Cargo.toml.
#
# Windows: dx12 + vulkan + gles — три кандидата для backend_probe (Vulkan→GL→DX12
# по умолчанию; BUG-274/275). До P1-wgpu-vkgl был только dx12, поэтому проба
# всегда откатывалась на DX12. Cargo-фича = "gles"; enum-константа = Backends::GL.
# Linux: vulkan (стандарт для desktop-компоузиторов).
# macOS: metal.
[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, optional = true, features = ["dx12", "vulkan", "gles", "wgsl", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, optional = true, features = ["vulkan", "wgsl", "std"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, optional = true, features = ["metal", "wgsl", "std"] }

[dev-dependencies]
lumen-html-parser.workspace = true
lumen-css-parser.workspace = true
lumen-layout.workspace = true
lumen-core.workspace = true

[features]
# ВАЖНО: ни один флаг ниже НЕ выбирает бэкенд — они лишь решают, что вообще
# компилируется. Выбор рабочего бэкенда автоматический и происходит в рантайме
# (`crates/shell/src/backend_factory.rs`): `LUMEN_BACKEND` → иначе wgpu (ADR-017)
# с probe-выбором API Vulkan→GL→DX12 (`backend_probe.rs`, результат кэшируется в
# `<exe_dir>/data/paint/backend_probe.txt`) → при сбое инициализации автоматический
# откат на femtovg. Поэтому шелл держит в своём `default` ОБА бэкенда сразу
# (`crates/shell/Cargo.toml`): убрать оттуда `backend-femtovg` — значит убрать
# fallback, а не «выбрать wgpu».
#
# `default` этого крейта внутри workspace не применяется вовсе: корневой
# Cargo.toml тянет `lumen-paint` с `default-features = false`. Значение ниже
# работает только при отдельной сборке самого крейта — менять его смысла нет,
# и на выбор бэкенда в браузере оно не влияет.
default = ["backend-femtovg"]

# wgpu-бэкенд — рантайм-дефолт браузера (ADR-017, вытеснил порядок ADR-010 RB-9)
backend-wgpu = ["dep:wgpu", "dep:winit"]

# femtovg-бэкенд — рантайм-fallback: только при сбое инициализации wgpu либо по
# явному `LUMEN_BACKEND=femtovg` (ADR-017; был дефолтом до флипа, ADR-010 RB-9)
backend-femtovg = ["dep:femtovg", "dep:glutin", "dep:glutin-winit", "dep:winit", "dep:imgref", "dep:rgb"]

# vello-бэкенд — план фазы 3, RB-7 заглушка (dep:vello добавляется в RB-10)
backend-vello = []

# CPU-бэкенд (tiny-skia) — headless CI без GPU; реализует RenderBackend (ADR-010 RB-8)
backend-cpu = ["cpu-render"]

# CompareBackend: параллельный рендер двумя бэкендами + pixel diff (RB-8)
# Требует два бэкенда с screenshot_rgba(); по умолчанию подтягивает backend-cpu.
compare = ["backend-cpu"]

# Обратная совместимость: lumen-driver использует lumen-paint/cpu-render
cpu-render = ["tiny-skia"]

# Составная фича для lumen-driver: compare (backend-cpu) + backend-cpu
compare-cpu = ["compare"]

# Политики проекта как машинные проверки — [workspace.lints] в корневом
# Cargo.toml, протокол docs/lint-policy.md.
[lints]
workspace = true
