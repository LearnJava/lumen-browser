[package]
name = "lumen-layout"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lumen: layout engine (block + inline for Phase 0)"

[dependencies]
lumen-core.workspace = true
lumen-dom.workspace = true
lumen-css-parser.workspace = true
lumen-html-parser.workspace = true
lumen-image.workspace = true
# ADR-016 M4.1: parallel selector matching for flex/grid/table item containers.
# Permanent dep: work-stealing parallelism for independent sibling style computations.
rayon = "1"
# UAX #9 Unicode Bidirectional Algorithm + BidiMirroring table, for the
# `direction` / `unicode-bidi` inline reordering pass (`src/bidi.rs`).
# Permanent deps: pure Unicode data tables — the resolution rules need the full
# Bidi_Class property of every code point, which is not hand-rollable.
unicode-bidi = "0.3"
unicode-bidi-mirroring = "0.2"
# Why this dependency (serde): permanent, same workspace entry already used by
# lumen-dom/lumen-core/lumen-storage. `Length`/`CalcNode` need it so a future
# `DisplayCommand` derive (lumen-paint) can serialize a display list for the
# lumen-renderer IPC transport (P3-gpusandbox srez A6) — see
# docs/tasks/ph3-gpu-process-sandbox.md's `Length::Calc(Box<CalcNode>)` gap.
serde = { workspace = true }
workspace-hack = { version = "0.1", path = "../../../workspace-hack" }

[dev-dependencies]
# Why this dependency (bincode, dev-only): round-trips the new `Length`/
# `CalcNode` Serialize/Deserialize derives through the actual wire format
# `lumen-ipc` uses (`crates/ipc/src/lib.rs`), not just serde's abstract
# model — permanent, same workspace entry already used by lumen-ipc.
bincode = { workspace = true }

[features]
# Opt-in visual profiler (Tracy GUI) — forwards to lumen-core's own `tracy`
# feature. Every crate in the chain needs its own feature of this name for
# `lumen_core::tracy_zone!`'s internal `#[cfg(feature = "tracy")]` to
# evaluate against *this* crate (Cargo feature unification, not inheritance).
tracy = ["lumen-core/tracy"]

# Политики проекта как машинные проверки — [workspace.lints] в корневом
# Cargo.toml, протокол docs/lint-policy.md.
[lints]
workspace = true
