[package]
name = "lumen-chrome"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lumen: compile-time bridge from the CC design asset (assets/chrome/chrome.html) to typed Rust — element-id resolver, ChromeAction enum, template registry."
build = "build.rs"

[dependencies]
lumen-html-parser = { workspace = true }
lumen-css-parser = { workspace = true }
lumen-dom = { workspace = true }
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[build-dependencies]
lumen-html-parser = { workspace = true }
lumen-css-parser = { workspace = true }
lumen-dom = { workspace = true }

[dev-dependencies]
lumen-layout = { workspace = true }
lumen-core = { workspace = true }
# CC-16 census only (`cc16_parse_cost_census`): prices the pre-parse proposal's
# own restore step — `lumen-dom` already derives serde and depends on bincode
# for T3 hibernation, so the measurement uses the exact mechanism CC-16 would.
bincode = { workspace = true }
