[package]
name = "lumen-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lumen: KV-хранилище с origin-партиционированием (cookies, history, profile)"

[dependencies]
lumen-core.workspace = true
rusqlite.workspace = true
serde.workspace = true
# Provisional accelerator (§5): Public Suffix List как compiled-in static
# таблица (без runtime I/O, без зависимостей). Trait-anchor — `PublicSuffixList`
# в lumen-core::ext. Graduation criterion: реалистично — никогда (формат
# PSL стабилен, обновления списка приходят снаружи через bump версии crate-а).
psl = "2"
# Permanent (§5): SHA-256 for per-origin IDB file key derivation (C-5).
# Already in the dependency graph via lumen-js and lumen-network (sha2 0.10).
sha2 = "0.10"
# Provisional (§5): разбор Chromium `Bookmarks` JSON при импорте (UX-IMPORT).
# Уже в графе (lumen-ai). Graduation: свой разбор JSON, если появится в lumen-core.
serde_json = "1.0"
# Provisional (§5): deflate compression for T3-hibernated DOM blobs (ADR-008 §10J.1).
# Reuses the already-vendored flate2 (PNG iCCP path) — no new external dependency.
# Pure-Rust miniz_oxide backend, cross-OS bit-stable, no C toolchain. Graduation
# criterion: replace with a higher-ratio pure-Rust zstd when one matures.
flate2.workspace = true
# Provisional (§5): LZ4 frame compression for T2 sleeping-tab JS heap blobs (GG-5).
# Faster compress/decompress than zlib at comparable ratio for binary/mixed data.
lz4_flex.workspace = true
# Permanent (§5, ADR-011): AES-256-GCM for per-profile storage key wrapping.
# Already in the dependency graph via lumen-js — zero incremental build cost.
aes-gcm = "0.10"
# Permanent (§5, ADR-011): HMAC-SHA256 for PBKDF2 key derivation in profile vault.
# Already in the dependency graph via lumen-js — zero incremental cost.
hmac = "0.12"
# Permanent (§5): OS CSPRNG for generating random key material (keys, salts, nonces).
# Already in the dependency graph via lumen-js and lumen-network.
getrandom = "0.2"
# Permanent (§5): P-256 ECDH for WebPush message decryption (RFC 8291) —
# `PushStore::push_deliver` needs the subscription's private scalar to derive
# the shared secret with the push service's ephemeral key. Already in the
# dependency graph via lumen-js and lumen-network (same version/features).
p256 = { version = "0.13", features = ["ecdh"] }
# Provisional (§5): AES-256-CBC + PKCS#5 PBES2 для импорта паролей Firefox
# (UX-IMPORT) — `key4.db` расшифровывается стандартным RFC 8018, не
# внутренним форматом NSS. aes/cbc уже в графе (lumen-js, тот же паттерн
# `cbc::Decryptor::<aes::Aes256>` — crates/js/src/subtle_crypto.rs); pkcs5 и
# pbkdf2 — новые записи в Cargo.lock. Неподтверждено против настоящего
# профиля Firefox — см. doc-comment import_logins_firefox.rs.
# Graduation: постоянная, пока поддерживается импорт из Firefox.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pkcs5 = { version = "0.7", features = ["pbes2", "alloc"] }
# Provisional (§5): PBKDF2-HMAC-SHA256 — та же цель, тестовый шифрующий
# встречный ход (production-код только расшифровывает через pkcs5).
pbkdf2 = "0.12"
# Provisional (§5): NSS выводит "эффективный пароль" как SHA1(globalSalt +
# masterPassword) — только это, не общий хеш-примитив широкого назначения.
sha1 = "0.10"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }

[target.'cfg(windows)'.dependencies]
# Provisional (§5): windows-sys — CryptUnprotectData (DPAPI) для ключа паролей Chrome/Edge
# при импорте (UX-IMPORT). Уже в графе (lumen-a11y, lumen-shell, winit): новых записей
# в Cargo.lock нет. Trait-anchor: нет, единственный потребитель — import_logins.rs.
# Graduation: постоянная, пока импорт из Chromium на Windows поддерживается.
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
# Integration test only: serialise a real parsed `Document` to verify the
# hibernation blob round-trips and actually shrinks (ADR-008 §10J.1).
lumen-dom = { workspace = true }
lumen-html-parser = { workspace = true }

# Политики проекта как машинные проверки — [workspace.lints] в корневом
# Cargo.toml, протокол docs/lint-policy.md.
[lints]
workspace = true
