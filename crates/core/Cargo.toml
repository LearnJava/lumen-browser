[package]
name = "lumen-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Lumen: foundational types and traits. Bottom of the dependency graph — every other Lumen crate depends on this one."

[dependencies]
# Why this dependency (serde): serialization for network transport (MCP, BiDi) — permanent.
serde = { version = "1.0", features = ["derive"] }
# Why this dependency (getrandom): permanent. Minimal dep — delegates directly to
# the OS CSPRNG (CryptGenRandom/getrandom syscall). Already used elsewhere in the
# workspace (crates/js, crates/network) for the same purpose; here it backs
# `auth::generate_token` (ADR-024 §Access model, DEVX-15).
getrandom = "0.2"
workspace-hack = { version = "0.1", path = "../../workspace-hack" }
# Why this dependency (tracy-client): opt-in visual profiler, provisional,
# feature-gated — see the workspace Cargo.toml comment above the version pin.
tracy-client = { workspace = true, optional = true }
# Why this dependency (url): permanent (ADR-027 — the WHATWG URL Standard's
# host/path/query/fragment splitting is a spec state machine, not a decision
# we own). Trait-anchor: `crate::url::Url`, this crate's own swap-point type
# (LIB-6, docs/conformance/2026-08-31.md: own hand-rolled parser passed only
# 41.95% of urltestdata.json — two entire missing algorithm branches, IPv6
# bracket literals and forbidden/control host code point handling, not
# isolated gaps). `Url` still does NOT re-export this crate's types: `host()`
# stays our own raw, unnormalized (Unicode, original-case) substring — the
# address bar's IDN spoof guard (`crates/shell/src/address_bar.rs::
# guard_display_text`, DS-6) substring-replaces the exact text the user
# typed, which this crate's ASCII/IDNA-normalized `host_str()` cannot give
# back. `lumen-core::idn`/`lumen-core::punycode` (the *display* decision of
# Unicode vs. Punycode) stay ours per LIB-6's own text.
url = "2"

[dev-dependencies]
# Why this dependency (serde_json, dev-only): LIB-0 conformance census
# (docs/conformance-method.md) reads tests/wpt/url/resources/urltestdata.json
# to measure lumen_core::url against the WHATWG corpus before ADR-027 LIB-6
# decides whether to replace it. Already resolved in the workspace lockfile
# (crates/js, crates/shell, ...); test-only here, no prod footprint.
serde_json = "1.0"

[features]
tracy = ["dep:tracy-client"]

# Политики проекта как машинные проверки — [workspace.lints] в корневом
# Cargo.toml, протокол docs/lint-policy.md.
[lints]
workspace = true
