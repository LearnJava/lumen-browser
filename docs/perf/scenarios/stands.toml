# Стенды самопроверки раннера (stand = true): локальные страницы из samples/compat-scenarios/.
# Не входят в SPR-w — показывают, что сам раннер, MCP-шаги и оракул работают.

[[scenario]]
id = "stand-login-two-step"
title = "Двухшаговый вход (почта → пароль → вход) на локальном стенде"
category = "login"
lang = "en"
stand = true
steps = [
  { do = "navigate", url = "{stand}/login-two-step.html" },
  { do = "wait", cond = "document_ready" },
  { do = "type", selector = "#email", text = "tester@example.com" },
  { do = "click", selector = "#next" },
  { do = "wait", cond = "visible", selector = "#pw", timeout_s = 10 },
  { do = "type", selector = "#pw", text = "not-a-real-password" },
  { do = "click_text", text = "^Sign in$" },
]
oracle = [
  { kind = "url", value = "login-done\\.html\\?u=tester" },
  { kind = "visible", value = "#ok" },
  { kind = "text", value = "Signed in" },
]

[[scenario]]
id = "stand-checkout-form"
title = "Форма оплаты: ввод карты и отправка формы (GET) на локальном стенде"
category = "payment"
lang = "en"
stand = true
steps = [
  { do = "navigate", url = "{stand}/checkout.html" },
  { do = "wait", cond = "document_ready" },
  { do = "type", selector = "#card", text = "4111111111111111" },
  { do = "type", selector = "#exp", text = "12/30" },
  { do = "type", selector = "#cvc", text = "123" },
  { do = "click", selector = "#submit" },
]
oracle = [
  { kind = "visible", value = "#result" },
  { kind = "text", value = "Payment accepted: 1111" },
]

[[scenario]]
id = "stand-3ds-iframe"
title = "3DS-имитация: карта → кадр банка (ACS) → подтверждение → postMessage в страницу магазина"
category = "payment"
lang = "en"
stand = true
steps = [
  { do = "navigate", url = "{stand}/3ds-pay.html" },
  { do = "wait", cond = "document_ready" },
  { do = "type", selector = "#card", text = "4000000000003220" },
  { do = "click", selector = "#submit" },
  { do = "wait", cond = "visible", selector = "#acs", timeout_s = 10 },
  { do = "sleep", seconds = 1.5 },
  { do = "eval", code = "(() => { const d = document.getElementById('acs').contentDocument; if (!d || !d.getElementById('confirm')) return false; d.getElementById('confirm').click(); return true; })()", expect = true },
]
oracle = [
  { kind = "visible", value = "#result" },
  { kind = "text", value = "3DS passed: 3220" },
]

[[scenario]]
id = "stand-oauth-popup"
title = "Вход через внешнего поставщика: попап window.open → ввод → postMessage в страницу сайта → закрытие попапа"
category = "login"
lang = "en"
stand = true
steps = [
  { do = "navigate", url = "{stand}/oauth-popup.html" },
  { do = "wait", cond = "document_ready" },
  { do = "click", selector = "#signin" },
  { do = "switch_tab", url = "oauth-idp\\.html" },
  { do = "wait", cond = "visible", selector = "#user", timeout_s = 10 },
  { do = "type", selector = "#user", text = "tester@example.com" },
  { do = "click", selector = "#allow" },
  { do = "wait", cond = "visible", selector = "#done", timeout_s = 10 },
  { do = "close_tab" },
  { do = "wait", cond = "visible", selector = "#result", timeout_s = 10 },
]
oracle = [
  { kind = "url", value = "oauth-popup\\.html" },
  { kind = "text", value = "Signed in as tester@example\\.com" },
]

[[scenario]]
id = "stand-3ds-newtab"
title = "3DS-имитация: страница банка (ACS) открывается во второй вкладке, подтверждение возвращается postMessage на opener"
category = "payment"
lang = "en"
stand = true
steps = [
  { do = "navigate", url = "{stand}/3ds-pay-tab.html" },
  { do = "wait", cond = "document_ready" },
  { do = "type", selector = "#card", text = "4000000000003220" },
  { do = "click", selector = "#submit" },
  { do = "switch_tab", url = "3ds-acs-tab\\.html\\?card=4000000000003220" },
  { do = "wait", cond = "visible", selector = "#confirm", timeout_s = 10 },
  { do = "click", selector = "#confirm" },
  { do = "switch_tab", index = 0 },
  { do = "wait", cond = "visible", selector = "#result", timeout_s = 10 },
]
oracle = [
  { kind = "url", value = "3ds-pay-tab\\.html" },
  { kind = "text", value = "3DS passed: 3220" },
]
