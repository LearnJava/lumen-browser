# Видео, почта, документы, файлы (вес 2; файлы — 1). Видео: `readyState >= 1` (метаданные получены) — декодер
# и сетевой слой отработали; автозапуск не требуется. Почта: страница входа, ввод логина. Сценарии с `account`
# входят целиком (логин → пароль → ящик), без переменных <ACC>_USER / <ACC>_PASS получают skip no_account.

[[scenario]]
id = "video-youtube"
title = "YouTube: страница ролика, видео получило метаданные"
category = "video"
lang = "en"
steps = [
  { do = "navigate", url = "https://www.youtube.com/watch?v=jNQXAC9IVRw" },
  { do = "wait", cond = "document_ready" },
  { do = "click_text", text = "^(Accept all|Принять все|Reject all)$", optional = true },
  { do = "wait", cond = "visible", selector = "video", timeout_s = 30 },
]
oracle = [
  { kind = "eval", value = "(() => { const v = document.querySelector('video'); return !!v && v.readyState >= 1; })()" },
]
oracle_wait_s = 25

[[scenario]]
id = "video-rutube"
title = "Rutube: главная → первый ролик, видео получило метаданные"
category = "video"
lang = "ru"
steps = [
  { do = "navigate", url = "https://rutube.ru/" },
  { do = "wait", cond = "document_ready" },
  { do = "sleep", seconds = 3 },
  { do = "eval", code = "(() => { const a = document.querySelector('a[href*=\"/video/\"]'); if (!a) return false; location.href = a.href; return true; })()", expect = true },
  { do = "wait", cond = "visible", selector = "video", timeout_s = 30 },
]
oracle = [
  { kind = "eval", value = "(() => { const v = document.querySelector('video'); return !!v && v.readyState >= 1; })()" },
]
oracle_wait_s = 25

# Эталон: документ не доходит до readyState complete за 30 с (долгие опросы), навигация считается зависшей.
[[scenario]]
id = "video-vkvideo"
title = "VK Видео: главная → первый ролик, плеер открывается"
category = "video"
mode = "manual"
lang = "ru"
steps = [
  { do = "navigate", url = "https://vkvideo.ru/" },
  { do = "wait", cond = "document_ready" },
  { do = "sleep", seconds = 3 },
  { do = "eval", code = "(() => { const a = document.querySelector('a[href*=\"/video-\"], a[href*=\"/video\"]'); if (!a) return false; location.href = a.href; return true; })()", expect = true },
  { do = "wait", cond = "document_ready" },
  { do = "sleep", seconds = 4 },
]
oracle = [
  { kind = "eval", value = "!!document.querySelector('video')" },
]
oracle_wait_s = 25

