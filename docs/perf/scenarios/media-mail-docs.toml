[[scenario]]
id = "mail-yandex-inbox"
title = "Яндекс Почта: вход с учётной записью → список писем (нужен YANDEX_USER/YANDEX_PASS)"
category = "mail"
lang = "ru"
mode = "manual"
account = "YANDEX"
steps = [
  { do = "navigate", url = "https://passport.yandex.ru/auth?retpath=https%3A%2F%2Fmail.yandex.ru%2F" },
  { do = "wait", cond = "visible", selector = "#passp-field-login" },
  { do = "type", selector = "#passp-field-login", text = "{user}" },
  { do = "click_text", text = "^Войти$" },
  { do = "wait", cond = "visible", selector = "#passp-field-passwd" },
  { do = "type", selector = "#passp-field-passwd", text = "{pass}" },
  { do = "click_text", text = "^Войти$" },
  { do = "wait", cond = "document_ready" },
]
oracle = [
  { kind = "url", value = "mail\\.yandex\\.ru" },
  { kind = "text", value = "Входящие|Inbox" },
]
oracle_wait_s = 30

