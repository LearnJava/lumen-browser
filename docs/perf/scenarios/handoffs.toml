# Плановые передачи (ADR-035): сценарии, которые Lumen до этапа 3 сознательно не проходит (DRM, ГОСТ-TLS,
# электронная подпись, звонки). Раннер их не запускает (skip handoff:<вид>), в SPR-w они не входят; запись нужна,
# чтобы список передач был виден в `--list` и менялся вместе с roadmap. Когда передача закрывается, строка
# `handoff` снимается и сценарий входит в метрику — оракул к тому моменту должен быть откалиброван по Chrome.

[[scenario]]
id = "handoff-drm-widevine"
title = "Widevine: демо-плеер DRM воспроизводит защищённый поток"
category = "video"
lang = "en"
handoff = "drm"
steps = [
  { do = "navigate", url = "https://bitmovin.com/demos/drm" },
  { do = "wait", cond = "document_ready" },
  { do = "sleep", seconds = 5 },
]
oracle = [
  { kind = "eval", value = "(() => { const v = document.querySelector('video'); return !!v && v.readyState >= 2 && v.currentTime > 0; })()" },
]

