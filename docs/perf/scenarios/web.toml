# Повседневная сеть (вес 1): поиск, новости, магазины, карты, соцсети. Оракул — результат пути пользователя
# (выдача поиска, карточка товара, карта), а не просто «страница загрузилась».

# Не калибруется с точки 2026-10-15: Chrome получает ERR_CONNECTION_CLOSED на узле сайта (маршрут/блокировка); проверить с другой точки.
[[scenario]]
id = "search-yandex"
title = "Яндекс: запрос из строки в URL → выдача"
category = "search"
mode = "manual"
lang = "ru"
steps = [
  { do = "navigate", url = "https://yandex.ru/search/?text=%D0%BF%D0%BE%D0%B3%D0%BE%D0%B4%D0%B0+%D0%BC%D0%BE%D1%81%D0%BA%D0%B2%D0%B0" },
  { do = "wait", cond = "document_ready" },
  { do = "sleep", seconds = 2 },
]
oracle = [
  { kind = "text", value = "погода|Погода" },
  { kind = "not_text", value = "ERR_" },
]

[[scenario]]
id = "search-google"
title = "Google: запрос → выдача"
category = "search"
lang = "en"
steps = [
  { do = "navigate", url = "https://www.google.com/search?q=rust+programming+language&hl=en" },
  { do = "wait", cond = "document_ready" },
  { do = "click_text", text = "^(Accept all|Reject all)$", optional = true },
]
oracle = [
  { kind = "text", value = "Rust" },
  { kind = "visible", value = "#search, #main, #rso" },
]

