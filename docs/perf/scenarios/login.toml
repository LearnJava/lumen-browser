# Вход до пароля (вес 3): страница входа открывается, поле логина принимает ввод, переход на шаг пароля
# или отказ «такого аккаунта нет». Реальных учётных записей нет — вводится несуществующий логин;
# оракул принимает любой из честных исходов сайта (шаг пароля / «аккаунт не найден»).
# Селекторы и тексты калибруются по Chrome (`--chrome-only`), подробности — docs/compat-scenarios.md.

[[scenario]]
id = "login-google"
title = "Google: ввод почты → шаг пароля или «аккаунт не найден»"
category = "login"
lang = "en"
steps = [
  { do = "navigate", url = "https://accounts.google.com/signin/v2/identifier?hl=en" },
  { do = "wait", cond = "visible", selector = "#identifierId, input[type=email]" },
  { do = "type", selector = "#identifierId, input[type=email]", text = "lumen.compat.probe.7391@gmail.com" },
  { do = "click_text", text = "^(Next|Далее)$" },
]
oracle = [
  { kind = "text", value = "Couldn.t find|Enter your password|Show password|Введите пароль" },
]

# Не калибруется с точки 2026-10-15: Chrome получает ERR_CONNECTION_CLOSED на узле сайта (маршрут/блокировка); проверить с другой точки.
[[scenario]]
id = "login-yandex-id"
title = "Яндекс ID: логин → шаг пароля или «такого аккаунта нет»"
