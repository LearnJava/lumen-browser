  { do = "navigate", url = "https://passport.yandex.ru/auth" },
  { do = "wait", cond = "visible", selector = "#passp-field-login" },
  { do = "type", selector = "#passp-field-login", text = "lumen-compat-probe-7391" },
  { do = "click_text", text = "^Войти$" },
]
oracle = [
  { kind = "text", value = "Такого аккаунта нет|Введите пароль|Неверный логин|Пароль" },
]

[[scenario]]
id = "login-vk-id"
title = "VK ID: страница входа, поле телефона принимает ввод (без отправки — SMS не уходит)"
category = "login"
lang = "ru"
steps = [
  { do = "navigate", url = "https://id.vk.com/auth?app_id=7913379&v=1.67.0&redirect_uri=https%3A%2F%2Fvk.com%2Ffeed&uuid=lumen" },
  { do = "wait", cond = "visible", selector = "input[name=phone]", timeout_s = 30 },
  { do = "type", selector = "input[name=phone]", text = "9000000000" },
]
oracle = [
  { kind = "visible", value = "button[type=submit]" },
  { kind = "eval", value = "document.querySelector('input[name=phone]').value.replace(/\\D/g,'').length >= 4" },
]

