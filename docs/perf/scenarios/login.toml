# Поля входа Reddit лежат в shadow DOM (селектором верхнего документа недоступны) — проверяется отрисовка страницы входа.
[[scenario]]
id = "login-reddit"
title = "Reddit: страница входа отрисована (поля в shadow DOM — ввод не проверяется)"
category = "login"
lang = "en"
steps = [
  { do = "navigate", url = "https://www.reddit.com/login/" },
  { do = "wait", cond = "document_ready" },
  { do = "sleep", seconds = 3 },
]
oracle = [
  { kind = "text", value = "Log In|Войти|Вход" },
  { kind = "eval", value = "document.querySelectorAll('button').length >= 3" },
]
