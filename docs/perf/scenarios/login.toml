# Эталон нестабилен: Amazon то отдаёт форму почты, то капчу/пустую страницу (headless Chrome, 2026-10-15).
[[scenario]]
id = "login-amazon"
title = "Amazon: ввод почты → шаг пароля или «аккаунта нет»"
category = "login"
mode = "manual"
lang = "en"
steps = [
  { do = "navigate", url = "https://www.amazon.com/ap/signin?openid.pape.max_auth_age=0&openid.return_to=https%3A%2F%2Fwww.amazon.com%2F&openid.identity=http%3A%2F%2Fspecs.openid.net%2Fauth%2F2.0%2Fidentifier_select&openid.assoc_handle=usflex&openid.mode=checkid_setup&openid.claimed_id=http%3A%2F%2Fspecs.openid.net%2Fauth%2F2.0%2Fidentifier_select&openid.ns=http%3A%2F%2Fspecs.openid.net%2Fauth%2F2.0" },
  { do = "wait", cond = "visible", selector = "#ap_email_login, #ap_email, input[name=email]", timeout_s = 30 },
  { do = "type", selector = "#ap_email_login, #ap_email, input[name=email]", text = "lumen.compat.probe.7391@example.com" },
  { do = "click", selector = "#continue, input[type=submit]" },
]
oracle = [
  { kind = "text", value = "Password|Пароль|We cannot find an account|Create your Amazon account|Не удаётся найти" },
]

