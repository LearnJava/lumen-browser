# Банки, оплата, госуслуги (вес 3). Без учётных записей: страница входа открывается, форма принимает ввод,
# платёжная форма (в т.ч. кадры эквайера) отрисовывается. Шаги внутри чужих кадров (ввод карты в iframe
# эквайера) и смена вкладки (попап 3DS/OAuth) раннер пока не умеет — см. docs/compat-scenarios.md §Границы.
# Полная цепочка 3DS проверяется на локальном стенде stand-3ds-redirect (docs/perf/scenarios/stands.toml).

[[scenario]]
id = "bank-sberbank"
title = "Сбербанк: главная страница отрисована, пункт СберБанк Онлайн на месте"
category = "bank"
lang = "ru"
steps = [
  { do = "navigate", url = "https://www.sberbank.ru/ru/person" },
  { do = "wait", cond = "document_ready" },
  { do = "click_text", text = "^(Принять|Согласен|Хорошо)$", optional = true },
  { do = "sleep", seconds = 2 },
]
oracle = [
  { kind = "text", value = "СберБанк Онлайн|Сбербанк Онлайн" },
  { kind = "not_text", value = "ERR_" },
]

[[scenario]]
id = "bank-tbank"
title = "Т-Банк: страница входа, поле телефона принимает ввод"
category = "bank"
lang = "ru"
steps = [
  { do = "navigate", url = "https://www.tbank.ru/login/" },
  { do = "wait", cond = "visible", selector = "input" },
  { do = "type", selector = "input", text = "9001234567" },
]
oracle = [
  { kind = "eval", value = "document.querySelector('input').value.replace(/\\D/g,'').length >= 4" },
]

