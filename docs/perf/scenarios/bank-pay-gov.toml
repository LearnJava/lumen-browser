mode = "manual"
title = "PayPal: вход, почта → шаг пароля"
category = "payment"
lang = "en"
steps = [
  { do = "navigate", url = "https://www.paypal.com/signin" },
  { do = "wait", cond = "visible", selector = "#email" },
  { do = "type", selector = "#email", text = "lumen.compat.probe.7391@example.com" },
  { do = "click", selector = "#btnNext" },
]
oracle = [
  { kind = "visible", value = "#password" },
]

