<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Lumen — Колода: карусель</title>
<style>
  :root{--bg:#0f1116;--panel:#171a20;--ink:#e8eaed;--mut:#8a919c;--line:#262b33;--acc:#5b9dff;--acc2:#8b5cf6}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .top{height:42px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{font-weight:700}.brand span{color:var(--acc)}
  .omni{flex:1;max-width:440px;margin:0 auto;height:32px;display:flex;align-items:center;padding:0 14px;background:#0b0d10;border:1px solid var(--line);border-radius:16px;font-size:13px;color:var(--mut);cursor:pointer}
  .omni:hover{border-color:#3a4250}
  .ib{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--mut);cursor:pointer;font-size:12.5px}
  .ib:hover{color:var(--ink);border-color:#3a4250}
  .scene{flex:1;display:flex;align-items:center;justify-content:center;perspective:1200px;position:relative;min-height:0}
  .ring{position:relative;width:520px;height:340px;transform-style:preserve-3d}
  .card{position:absolute;left:50%;top:50%;width:300px;height:220px;margin:-110px 0 0 -150px;background:#fff;color:#222;border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .5s cubic-bezier(.2,.8,.3,1),opacity .5s;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .card .hd{height:34px;background:#f0f2f5;display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid #e4e6e8}
  .fav{width:14px;height:14px;border-radius:4px}
  .card .url{font-size:11.5px;color:#77809a;flex:1}
  .card .bd{padding:18px}
  .card .bd h3{margin:0 0 6px;font-size:17px}
  .card .bd p{margin:0;font-size:13px;color:#444;line-height:1.5}
  .card .bd .hero{height:60px;border-radius:8px;background:linear-gradient(120deg,#dfe6ee,#cfd8e3);margin-bottom:12px}
  .dots{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:7px}
  .dots span{width:7px;height:7px;border-radius:50%;background:#3a4250;cursor:pointer}
  .dots span.on{background:var(--acc);transform:scale(1.4)}
  .btns{position:absolute;bottom:16px;right:24px;display:flex;gap:8px}
  .btns button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font-size:16px}
  .btns button:hover{border-color:var(--acc);color:var(--acc)}
  #tip{position:fixed;z-index:100;pointer-events:none;background:#0d1117;color:#e6e9ee;font-size:12px;line-height:1.4;padding:7px 10px;border-radius:8px;max-width:290px;border:1px solid #2a313c;box-shadow:0 6px 20px rgba(0,0,0,.5);display:none}
  #tip b{color:#8fb8ec}#tip kbd{background:#262b33;border-radius:4px;padding:0 5px;font:11px 'Segoe UI';margin-left:4px}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">lumen<span>://</span>deck-3d</div>
    <div class="omni" data-tip="Адрес / @-команды" onclick="openPage('app.html?s=history')">🔍 lumen.local…</div>
    <button class="ib" data-tip="Все вкладки" onclick="openPage('app.html?s=home')">▦</button>
    <button class="ib" data-tip="Настройки" onclick="openPage('app.html?s=settings')">⚙</button>
  </div>
  <div class="scene"><div class="ring" id="ring"></div></div>
  <div class="dots" id="dots"></div>
  <div class="btns"><button data-tip="Предыдущая <kbd>←</kbd>" onclick="step(-1)">←</button><button data-tip="Следующая <kbd>→</kbd>" onclick="step(1)">→</button></div>
  <div id="tip"></div>
<script>
function openPage(u){window.open(u,'_blank')}
const P=[
 {t:'Lumen — движок',u:'lumen.local/docs',c:'#e3a008',h:'Архитектура',b:'DOM → layout → paint → V8.'},
 {t:'GitHub — lumen',u:'github.com/lumen',c:'#4285f4',h:'Репозиторий',b:'Код и issues.'},
 {t:'MDN — Grid',u:'mozilla.org',c:'#d93025',h:'CSS Grid',b:'Справочник.'},
 {t:'Подкаст',u:'youtube.com',c:'#34a853',h:'V8 и JIT',b:'Видео · PiP.'},
 {t:'V8 deep dive',u:'read-later',c:'#8b5cf6',h:'Inside V8',b:'68% прочитано.'},
 {t:'HTML Spec',u:'whatwg.org',c:'#fbbc05',h:'Standard',b:'Навигация.'},
];
let cur=0;
const ring=document.getElementById('ring'),dots=document.getElementById('dots');
function render(){
  ring.innerHTML=P.map((p,i)=>{
    let off=((i-cur+P.length/2)%P.length)-P.length/2;
    const ang=off*55;
    const rad=(ang*Math.PI)/180;
    const x=Math.sin(rad)*420, z=-Math.cos(rad)*200+200;
    const scale=z/420+0.4;
    return `<div class="card" style="transform:translate(-50%,-50%) translateX(${x}px) translateZ(${z-200}px) rotateY(${-off*25}deg) scale(${scale});opacity:${Math.abs(off)>2.5?0.15:1-z/900}" data-tip="<b>${p.t}</b><br>${p.u}" onclick="cur=${i};render();openPage('app.html?s=home')">
      <div class="hd"><span class="fav" style="background:${p.c}"></span><span class="url">${p.u}</span></div>
      <div class="bd"><div class="hero"></div><h3>${p.h}</h3><p>${p.b}</p></div></div>`;
  }).join('');
  dots.innerHTML=P.map((_,i)=>`<span class="${i===cur?'on':''}" onclick="cur=${i};render()"></span>`).join('');
}
function step(d){cur=(cur+d+P.length)%P.length;render()}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
const tip=document.getElementById('tip');
addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t)return;tip.innerHTML=t.dataset.tip;tip.style.display='block';});
addEventListener('mousemove',e=>{if(tip.style.display==='block'){tip.style.left=Math.min(e.clientX+14,innerWidth-300)+'px';tip.style.top=(e.clientY+16)+'px';}});
addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tip.style.display='none'});
render();
</script>
<script src="omni.js"></script>
<script src="chrome.js"></script>
</body>
</html>
