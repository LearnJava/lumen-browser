<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Lumen — Колода: свайп</title>
<style>
  :root{--bg:#101318;--panel:#181c22;--ink:#e8eaed;--mut:#8a919c;--line:#2a2f37;--acc:#5b9dff}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .top{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{font-weight:700}.brand span{color:var(--acc)}
  .omni{flex:1;max-width:420px;margin:0 auto;height:30px;display:flex;align-items:center;padding:0 13px;background:#0b0d10;border:1px solid var(--line);border-radius:15px;font-size:13px;color:var(--mut);cursor:pointer}
  .omni:hover{border-color:#3a4250}
  .ib{height:28px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:none;color:var(--mut);cursor:pointer;font-size:12px}
  .ib:hover{color:var(--ink);border-color:#3a4250}
  .deck{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
  .card{width:min(400px,86vw);height:min(560px,78vh);background:#fff;color:#222;border-radius:22px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.55);transition:transform .3s cubic-bezier(.2,.8,.3,1),opacity .3s;cursor:grab;touch-action:none;position:absolute}
  .card .hd{height:40px;background:#f0f2f5;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #e4e6e8}
  .fav{width:15px;height:15px;border-radius:4px}
  .card .url{font-size:12px;color:#77809a;flex:1}
  .card .bd{height:calc(100% - 40px);overflow:auto;padding:26px}
  .card .bd .hero{height:150px;border-radius:14px;background:linear-gradient(120deg,#dfe6ee,#cfd8e3);margin-bottom:18px}
  .card .bd h1{font-size:21px;margin:0 0 10px}
  .card .bd p{font-size:14.5px;line-height:1.65;color:#333}
  .card.drag{transition:none;cursor:grabbing}
  .dots{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10}
  .dots span{width:6px;height:6px;border-radius:50%;background:#3a4250;cursor:pointer;transition:all .2s}
  .dots span.on{background:var(--acc);transform:scale(1.5)}
  .hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);color:var(--mut);font-size:11.5px;z-index:10}
  #tip{position:fixed;z-index:100;pointer-events:none;background:#0d1117;color:#e6e9ee;font-size:12px;line-height:1.4;padding:7px 10px;border-radius:8px;max-width:290px;border:1px solid #2a313c;box-shadow:0 6px 20px rgba(0,0,0,.5);display:none}
  #tip b{color:#8fb8ec}#tip kbd{background:#262b33;border-radius:4px;padding:0 5px;font:11px 'Segoe UI';margin-left:4px}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">lumen<span>://</span>deck-swipe</div>
    <div class="omni" data-tip="Адрес / @-команды" onclick="openPage('app.html?s=history')">🔍 lumen.local…</div>
    <button class="ib" data-tip="Все вкладки" onclick="openPage('app.html?s=home')">▦</button>
    <button class="ib" data-tip="Настройки" onclick="openPage('app.html?s=settings')">⚙</button>
  </div>
  <div class="deck" id="d"></div>
  <div class="hint">Свайпните карту мышью или пальцем ← → · <kbd>Space</kbd> — перевернуть</div>
  <div class="dots" id="dots"></div>
  <div id="tip"></div>
<script>
function openPage(u){window.open(u,'_blank')}
const P=[
 {t:'Lumen — движок',u:'lumen.local/docs',c:'#e3a008',h:'Архитектура',b:'DOM-арена → layout → paint → V8. Потоковая загрузка.'},
 {t:'GitHub — lumen',u:'github.com/lumen',c:'#4285f4',h:'Репозиторий',b:'Код и issues. Работа в worktree-слотах.'},
 {t:'MDN — Grid',u:'developer.mozilla.org',c:'#d93025',h:'CSS Grid',b:'Справочник · спит (T3).'},
 {t:'Подкаст',u:'youtube.com',c:'#34a853',h:'V8 и JIT',b:'Видео · PiP доступен.'},
 {t:'V8 deep dive',u:'read-later',c:'#8b5cf6',h:'Inside V8',b:'68% · продолжить.'},
 {t:'HTML Spec',u:'whatwg.org',c:'#fbbc05',h:'Standard',b:'Навигация и bfcache.'},
];
let cur=0,drag=null;
const d=document.getElementById('d'),dots=document.getElementById('dots');
function render(){
  d.innerHTML='';
  P.forEach((p,i)=>{
    const off=i-cur;
    if(Math.abs(off)>2)return;
    const c=document.createElement('div');c.className='card';
    c.style.transform=`translateX(${off*110}%) scale(${1-Math.abs(off)*0.08}) rotate(${off*4}deg)`;
    c.style.zIndex=10-Math.abs(off);
    c.style.opacity=off===0?1:0.4;
    c.innerHTML=`<div class="hd"><span class="fav" style="background:${p.c}"></span><span class="url">${p.u}</span></div><div class="bd"><div class="hero"></div><h1>${p.h}</h1><p>${p.b}</p><p>Свайп-модель: карта уходит в сторону, следующая занимает место. Мышь или палец — одинаково.</p></div>`;
    if(off===0){c.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,moved:false};c.classList.add('drag')};}
    c.onpointerup=e=>{if(drag&&Math.abs(e.clientX-drag.x)>80){step(e.clientX<drag.x?1:-1)}drag=null;c.classList.remove('drag');c.style.transform=''};
    c.onpointermove=e=>{if(drag&&off===0){const dx=e.clientX-drag.x;if(Math.abs(dx)>10)drag.moved=true;c.style.transform=`translateX(${dx}px) rotate(${dx*0.03}deg)`}};
    c.onclick=()=>{if(!drag?.moved&&off===0)openPage('app.html?s=home')};
    d.appendChild(c);
  });
  dots.innerHTML=P.map((_,i)=>`<span class="${i===cur?'on':''}" onclick="cur=${i};render()"></span>`).join('');
}
function step(d){cur=(cur+d+P.length)%P.length;render()}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(e.key===' '){e.preventDefault();step(1)}});
const tip=document.getElementById('tip');
addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t)return;tip.innerHTML=t.dataset.tip;tip.style.display='block';});
addEventListener('mousemove',e=>{if(tip.style.display==='block'){tip.style.left=Math.min(e.clientX+14,innerWidth-300)+'px';tip.style.top=(e.clientY+16)+'px';}});
addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tip.style.display='none'});
render();
</script>
<script src="omni.js"></script>
<script src="chrome.js"></script>
</body>
</html>
