<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Lumen — Обзор</title>
<style>
  :root{--bg:#0d1014;--panel:#151920;--ink:#e8eaed;--mut:#8a919c;--line:#262c35;--acc:#5b9dff;--acc-soft:#1b2b45}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .top{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{font-weight:700;font-size:15px}
  .brand span{color:var(--acc)}
  .search{flex:1;max-width:480px;margin-left:14px;display:flex;align-items:center;height:32px;padding:0 14px;background:#0b0d10;border:1px solid var(--line);border-radius:16px;font-size:13px;color:var(--mut);cursor:text}
  .search:hover{border-color:#3a4250}
  .ib{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--mut);cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
  .ib:hover{color:var(--ink);border-color:#3a4250}
  /* ===== Mission control ===== */
  .mc{flex:1;overflow:auto;padding:34px 40px;position:relative}
  .mc .ttl{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 14px}
  .cluster{margin-bottom:36px}
  .cluster .ch{display:flex;align-items:center;gap:9px;margin-bottom:12px;font-size:13px;font-weight:600}
  .cluster .ch .dot{width:10px;height:10px;border-radius:3px}
  .cluster .ch .cnt{color:var(--mut);font-weight:400;font-size:11.5px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
  .thumb{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .18s,border-color .18s;position:relative}
  .thumb:hover{transform:translateY(-3px);border-color:var(--acc)}
  .thumb .th{height:26px;display:flex;align-items:center;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);font-size:11.5px}
  .thumb .fav{width:12px;height:12px;border-radius:3px;flex:none}
  .thumb .u{color:var(--mut);font-size:10.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .thumb .shot{height:130px;background:linear-gradient(140deg,#232a33,#1a2029);position:relative;overflow:hidden}
  .thumb .shot::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(0,0,0,.4))}
  .thumb .shot .bar{position:absolute;left:14px;right:14px;top:16px;height:10px;border-radius:5px;background:#2f3742}
  .thumb .shot .bar2{top:34px;width:60%}
  .thumb .shot .bar3{top:52px;width:80%}
  .thumb .shot .hero{position:absolute;left:14px;right:14px;top:80px;height:36px;border-radius:8px;background:#2a3140}
  .thumb .live{position:absolute;top:8px;right:8px;font-size:9.5px;background:#0f2a1a;color:#3fb96f;border-radius:10px;padding:2px 8px;font-weight:600}
  .thumb .sleep-tag{position:absolute;top:8px;right:8px;font-size:9.5px;background:#262c35;color:var(--mut);border-radius:10px;padding:2px 8px}
  .thumb .cont{position:absolute;left:8px;bottom:8px;font-size:9.5px;color:#9ab4e8;background:#16233c;border-radius:8px;padding:2px 7px}
  .empty-hint{text-align:center;color:var(--mut);padding:80px 0;font-size:14px}
  /* возврат */
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:50;align-items:center;justify-content:center}
  .backdrop.open{display:flex}
  .backdrop .inner{background:#fff;color:#222;border-radius:14px;padding:34px 44px;text-align:center;max-width:420px}
  .backdrop .inner h2{margin:0 0 8px;font-size:19px}
  .backdrop .inner p{color:#666;font-size:14px;margin:0 0 18px}
  .backdrop .inner button{border:none;background:var(--acc);color:#fff;border-radius:9px;padding:9px 22px;font-weight:600;cursor:pointer;font-size:14px}
  /* подсказки */
  #tip{position:fixed;z-index:100;pointer-events:none;background:#0d1117;color:#e6e9ee;font-size:12px;line-height:1.4;padding:7px 10px;border-radius:8px;max-width:300px;border:1px solid #2a313c;box-shadow:0 6px 20px rgba(0,0,0,.5);display:none}
  #tip b{color:#8fb8ec}#tip kbd{background:#262b33;border-radius:4px;padding:0 5px;font:11px 'Segoe UI';margin-left:4px}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">lumen<span>://</span>overview</div>
    <div class="search" data-tip="Поиск по всем открытым вкладкам — по заголовку и URL; @tabs в омнибоксе ищет и по содержимому">🔍 Найти вкладку или страницу…</div>
    <button class="ib" data-tip="Назад к странице <kbd>Esc</kbd>" onclick="closeBack()">← Назад</button>
    <button class="ib" data-tip="Новая вкладка <kbd>Ctrl+T</kbd>" onclick="openPage('page.html')">＋</button>
    <button class="ib" data-tip="Пространства — фильтр обзора по workspace" onclick="openPage('spaces.html')">▦ Пространства</button>
  </div>

  <div class="mc" id="mc">
    <div class="empty-hint">Режим «Обзор»: все вкладки всех пространств — живые превью. Клик по карточке вернёт на страницу.</div>
    <div id="clusters"></div>
  </div>

  <div class="backdrop" id="bd"><div class="inner">
    <h2 id="bdT">Страница</h2>
    <p id="bdD">В реальном браузере здесь откроется сама страница — в прототипе открываем демо-окно.</p>
    <button onclick="openPage('page.html');closeBack()">Открыть страницу</button>
  </div></div>

  <div id="tip"></div>
<script>
function openPage(p){window.open(p||'page.html','_blank')}
const DATA=[
 {ws:'Работа',c:'#7c3aed',tabs:[
   {t:'Lumen — движок',u:'lumen.local/docs',live:1,cont:'контейнер: работа'},
   {t:'GitHub — lumen-browser',u:'github.com/lumen'},
   {t:'PR #412 — ревью',u:'github.com/lumen/pull/412',cont:'контейнер: работа'},
   {t:'CI — pipeline',u:'ci.internal/run/88',sleep:1},
   {t:'Спека HTML',u:'html.spec.whatwg.org'},
 ]},
 {ws:'Дом',c:'#0b6fe0',tabs:[
   {t:'Новости',u:'news.example.com',live:1},
   {t:'Банк — счета',u:'bank.example.com',cont:'контейнер: личное'},
   {t:'Почта',u:'mail.example.com',sleep:1},
 ]},
 {ws:'Default',c:'#9aa3ad',tabs:[
   {t:'MDN — CSS Grid',u:'developer.mozilla.org',sleep:1},
   {t:'YouTube — доклад',u:'youtube.com/watch',live:1},
   {t:'Read-later: async Rust',u:'read-later'},
 ]},
];
const mc=document.getElementById('mc'),clusters=document.getElementById('clusters');
document.querySelector('.empty-hint').style.display='none';
DATA.forEach(w=>{
  const sec=document.createElement('div');sec.className='cluster';
  sec.innerHTML=`<div class="ch"><span class="dot" style="background:${w.c}"></span>${w.ws}<span class="cnt">${w.tabs.length} вкладок</span></div><div class="grid"></div>`;
  const g=sec.querySelector('.grid');
  w.tabs.forEach(tb=>{
    const d=document.createElement('div');d.className='thumb';
    d.innerHTML=`<div class="th"><span class="fav" style="background:${w.c}"></span><span class="u">${tb.u}</span>${tb.live?'<span class="live">LIVE</span>':tb.sleep?'<span class="sleep-tag">💤 спит</span>':''}</div><div class="shot"><div class="bar"></div><div class="bar bar2"></div><div class="bar bar3"></div><div class="hero"></div>${tb.cont?`<span class="cont">${tb.cont}</span>`:''}</div>`;
    d.dataset.tip=`<b>${tb.t}</b><br>${tb.u}${tb.live?' · воспроизводится медиа':''}${tb.sleep?' · спит (T3, мгновенное пробуждение)':''}${tb.cont?' · изолированные куки':''}<br><kbd>Enter</kbd> — перейти`;
    d.onclick=()=>{document.getElementById('bdT').textContent=tb.t;document.getElementById('bdD').textContent=tb.u+(tb.cont?' · '+tb.cont:'');document.getElementById('bd').classList.add('open')};
    g.appendChild(d);
  });
  clusters.appendChild(sec);
});
function closeBack(){document.getElementById('bd').classList.remove('open')}
addEventListener('keydown',e=>{if(e.key==='Escape')closeBack();if(e.key==='Enter'&&document.getElementById('bd').classList.contains('open')){openPage('page.html');closeBack()}});
const tip=document.getElementById('tip');
addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t)return;tip.innerHTML=t.dataset.tip;tip.style.display='block';});
addEventListener('mousemove',e=>{if(tip.style.display==='block'){tip.style.left=Math.min(e.clientX+14,innerWidth-320)+'px';tip.style.top=(e.clientY+16)+'px';}});
addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tip.style.display='none';});
</script>
<script src="omni.js"></script>
<script src="chrome.js"></script>
</body>
</html>
