<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Lumen — Command</title>
<style>
  :root{--bg:#101216;--panel:#171a1f;--ink:#e8eaed;--mut:#8a919c;--line:#262b33;--acc:#5b9dff;--acc-soft:#1b2b45;--grn:#3fb96f}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 'Segoe UI',system-ui,Consolas,monospace;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .bar{height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
  .brand{font-weight:700;font-size:15px;letter-spacing:.4px}
  .brand span{color:var(--acc)}
  .cmdline{flex:1;max-width:720px;display:flex;align-items:center;height:34px;padding:0 12px;background:#0b0d10;border:1px solid var(--line);border-radius:8px;font-family:Consolas,monospace;font-size:13.5px;cursor:text}
  .cmdline:hover{border-color:#3a4250}
  .cmdline .p{color:var(--acc)}
  .cmdline .cur{display:inline-block;width:8px;height:16px;background:var(--acc);vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .ib{height:30px;padding:0 9px;border:1px solid var(--line);border-radius:7px;background:none;color:var(--mut);cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
  .ib:hover{color:var(--ink);border-color:#3a4250}
  /* ===== Палитра команд (всегда видима в центре) ===== */
  .wrap{flex:1;display:flex;align-items:flex-start;justify-content:center;padding-top:9vh;overflow:auto}
  .palette{width:min(640px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5)}
  .palette .input{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);font-family:Consolas,monospace;font-size:14px}
  .palette .input .prompt{color:var(--acc)}
  .palette .input input{flex:1;background:none;border:none;outline:none;color:var(--ink);font:inherit;font-size:14px}
  .palette .input input::placeholder{color:#5b636e}
  .palette .groups{padding:8px}
  .glabel{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);padding:8px 10px 4px}
  .row{display:flex;align-items:center;gap:11px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13.5px}
  .row:hover,.row.sel{background:var(--acc-soft)}
  .row .k{width:20px;text-align:center;color:var(--acc);font-family:Consolas,monospace;font-size:13px;flex:none}
  .row .d{margin-left:auto;color:var(--mut);font-size:11.5px;font-family:'Segoe UI',sans-serif}
  .row .src{font-size:10.5px;color:var(--grn);background:#12271b;border-radius:4px;padding:1px 6px}
  .palette .foot{padding:9px 16px;border-top:1px solid var(--line);color:var(--mut);font-size:11.5px;display:flex;gap:14px}
  /* строка статуса */
  .status{height:26px;flex:none;display:flex;align-items:center;gap:16px;padding:0 14px;background:var(--panel);border-top:1px solid var(--line);font-size:11.5px;color:var(--mut)}
  .status b{color:var(--ink);font-weight:600}
  #tip{position:fixed;z-index:100;pointer-events:none;background:#0d1117;color:#e6e9ee;font-size:12px;line-height:1.4;padding:7px 10px;border-radius:8px;max-width:300px;border:1px solid #2a313c;box-shadow:0 6px 20px rgba(0,0,0,.5);display:none}
  #tip b{color:#8fb8ec}#tip kbd{background:#262b33;border-radius:4px;padding:0 5px;font:11px Consolas;margin-left:4px}
</style>
</head>
<body>
  <div class="bar">
    <div class="brand">lumen<span>://</span>command</div>
    <div class="cmdline" data-tip="Командная строка браузера: URL, поиск, @-команды<br>@history @notes @read-later @tabs @bookmarks @ai"><span class="p">›</span><span style="color:var(--mut)"> команда или адрес…</span><span class="cur"></span></div>
    <button class="ib" data-tip="Вкладки <kbd>Ctrl+Tab</kbd>">▤ 7</button>
    <button class="ib" data-tip="Щиты <kbd>Ctrl+Shift+U</kbd>">🛡 on</button>
    <button class="ib" data-tip="Настройки <kbd>F10</kbd>" onclick="openPage('focus.html')">⚙</button>
  </div>

  <div class="wrap">
    <div class="palette">
      <div class="input"><span class="prompt">›</span><input id="inp" placeholder="Введите команду, @-префикс или URL…" autocomplete="off" oninput="render(this.value)"></div>
      <div class="groups" id="list"></div>
      <div class="foot"><span><kbd>↑↓</kbd> выбор</span><span><kbd>Enter</kbd> выполнить</span><span><kbd>Tab</kbd> дополнить @</span><span style="margin-left:auto">источник: FTS5 по history.db · notes · read-later · tabs · bookmarks</span></div>
    </div>
  </div>

  <div class="status">
    <span><b>7</b> вкладок · <b>3</b> спят</span>
    <span>контейнер: <b>default</b></span>
    <span>щиты: <b>on</b> · трекеров заблокировано сегодня: <b>214</b></span>
    <span style="margin-left:auto">Lumen <b>0.5.0</b> · engine: own · js: V8</span>
  </div>

  <div id="tip"></div>
<script>
function openPage(p){window.open(p||'page.html','_blank')}
const DATA=[
 ['g','Переход','↵'],
 ['→','Открыть lumen.local/docs/engine','URL'],
 ['→','Найти «rust borrow checker»','поиск'],
 ['g','История  @history',''],
 ['✎','rust borrow checker — StackOverflow, 14:02','FTS'],
 ['✎','lumen release notes v0.4','FTS'],
 ['✎','MDN: async/await — сохранено 3 дня назад','FTS'],
 ['g','Заметки  @notes',''],
 ['✎','Идея: командная строка как главный UI','к странице lumen.local'],
 ['g','Читать позже  @read-later',''],
 ['▤','«Inside the V8 engine» — видео, 42 мин','read-later'],
 ['▤','«Rust async in depth» — статья','read-later'],
 ['g','Вкладки  @tabs',''],
 ['▤','GitHub — lumen-browser (активна)','','tabs'],
 ['▤','YouTube — доклад про JIT','спит','tabs'],
 ['g','Закладки  @bookmarks',''],
 ['★','rust-lang.org — nightly docs','закладка'],
 ['g','ИИ-ответ  @ai',''],
 ['✦','По вашим закладкам и заметкам: часто открываете темы V8 и async Rust — сводка ниже','RAG · Ollama'],
];
let sel=0,cur='';
function render(q){cur=q;sel=0;draw()}
function draw(){
  const l=document.getElementById('list');let html='',last='';
  DATA.forEach((d,i)=>{
    if(d[0]!==last){html+=`<div class="glabel">${d[0]==='g'?d[1]:d[0]}</div>`;last=d[0];}
    html+=`<div class="row ${i===sel?'sel':''}" onmouseenter="sel=${i};drawLite()" onclick="pick(${i})"><span class="k">${d[3]==='tabs'?'▤':d[3]==='RAG · Ollama'?'✦':'↵'}</span><span>${d[2]||d[1]}</span>${d[3]?`<span class="d">${d[3]}</span>`:''}</div>`;
  });
  l.innerHTML=html;
}
function drawLite(){document.querySelectorAll('#list .row').forEach((r,i)=>r.classList.toggle('sel',i===sel))}
function pick(i){const d=DATA[i];if(d[3]==='RAG · Ollama')openPage('page.html');else openPage('page.html')}
document.getElementById('inp').addEventListener('keydown',e=>{
  const rows=DATA.length;
  if(e.key==='ArrowDown'){sel=(sel+1)%rows;drawLite()}
  if(e.key==='ArrowUp'){sel=(sel-1+rows)%rows;drawLite()}
  if(e.key==='Enter')pick(sel);
});
const tip=document.getElementById('tip');
addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t)return;tip.innerHTML=t.dataset.tip;tip.style.display='block';});
addEventListener('mousemove',e=>{if(tip.style.display==='block'){tip.style.left=Math.min(e.clientX+14,innerWidth-300)+'px';tip.style.top=(e.clientY+16)+'px';}});
addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tip.style.display='none';});
draw();
</script>
<script src="omni.js"></script>
<script src="chrome.js"></script>
</body>
</html>
