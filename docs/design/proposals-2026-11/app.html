<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Lumen — раздел</title>
<style>
  body{margin:0;font:14px/1.55 'Segoe UI',system-ui,sans-serif;background:#f4f5f7;color:#1f2328;display:flex;flex-direction:column;height:100vh}
  header{background:#14161a;color:#e8eaed;padding:12px 20px;font-size:14px}
  header b{color:#7aa7d9}
  .tabs{display:flex;gap:2px;background:#e8eaee;padding:0 16px}
  .tabs span{padding:9px 16px;font-size:13px;color:#5b636e;border-radius:8px 8px 0 0;cursor:pointer}
  .tabs span.on{background:#fff;color:#1f2328;font-weight:600}
  main{flex:1;background:#fff;margin:0 16px;border-radius:12px 12px 0 0;padding:24px 28px;overflow:auto}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:#7d8590;font-size:13px;margin-bottom:18px}
  .row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f0f2f4;font-size:13.5px}
  .row:last-child{border-bottom:none}
  .row .u{margin-left:auto;color:#7d8590;font-size:12px}
  .row .badge{background:#e3eefc;color:#0b6fe0;border-radius:10px;padding:2px 9px;font-size:11px;font-weight:600}
  .bar{height:5px;border-radius:3px;background:#e8eaee;margin-top:5px;overflow:hidden}
  .bar i{display:block;height:100%;background:#0b6fe0}
  input[type=text],input[type=search]{width:100%;max-width:420px;border:1px solid #dde2e8;border-radius:9px;padding:9px 13px;font:inherit;font-size:14px;margin-bottom:14px;outline:none}
  input:focus{border-color:#0b6fe0}
  .sw{width:38px;height:21px;border-radius:11px;background:#cfd5dc;position:relative;cursor:pointer;display:inline-block}
  .sw::after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:left .15s}
  .sw.on{background:#1f9d55}.sw.on::after{left:19px}
  .set{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f0f2f4}
  .set .t{flex:1}.set .t b{display:block;font-size:14px}.set .t span{font-size:12px;color:#7d8590}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .tile{border:1px solid #dde2e8;border-radius:11px;padding:14px;cursor:pointer}
  .tile:hover{border-color:#0b6fe0}
  .tile .fav{width:26px;height:26px;border-radius:7px;margin-bottom:8px}
  .tile .n{font-weight:600;font-size:13px}.tile .d{font-size:11.5px;color:#7d8590}
</style>
</head>
<body>
<header><b>Lumen</b> — <span id="ttl"></span></header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<script>
const S=new URLSearchParams(location.search).get('s')||'home';
const TITLES={home:'Новая вкладка',settings:'Настройки',history:'История',bookmarks:'Закладки',downloads:'Загрузки',notes:'Заметки',readlater:'Читать позже',about:'О браузере',privacy:'Приватность',profiles:'Профили',workspaces:'Пространства',go:'Переход',ai:'Lumen AI'};
const NAV=Object.keys(TITLES);
function go(s){location.href='app.html?s='+s}
document.getElementById('ttl').textContent=TITLES[S]||'Lumen';
document.getElementById('tabs').innerHTML=NAV.map(k=>`<span class="${k===S?'on':''}" onclick="go('${k}')">${TITLES[k]}</span>`).join('');
const M=document.getElementById('main');
const DATA={
home:`<h1>Новая вкладка</h1><div class="sub">speed-dial: закреплённые тайлы + топ-сайты</div><div class="grid"><div class="tile"><div class="fav" style="background:#1f9d55"></div><div class="n">Документация</div><div class="d">docs · pinned</div></div><div class="tile"><div class="fav" style="background:#4285f4"></div><div class="n">Новости</div><div class="d">top-site</div></div><div class="tile"><div class="fav" style="background:#8b5cf6"></div><div class="n">Читать позже</div><div class="d">3 статьи</div></div><div class="tile"><div class="fav" style="background:#d8a400"></div><div class="n">Заметки</div><div class="d">6 заметок</div></div></div>`,
settings:`<h1>Настройки</h1><div class="sub">about:settings — все разделы браузера</div>
 <div class="set"><div class="t"><b>Щиты</b><span>блокировка рекламы, трекеров, fingerprint</span></div><span class="sw on" onclick="this.classList.toggle('on')"></span></div>
 <div class="set"><div class="t"><b>Tor-режим</b><span>SOCKS5 · отдельный профиль · без записи</span></div><span class="sw" onclick="this.classList.toggle('on')"></span></div>
 <div class="set"><div class="t"><b>GPC (Global Privacy Control)</b><span>Sec-GPC: 1 на каждом запросе</span></div><span class="sw on" onclick="this.classList.toggle('on')"></span></div>
 <div class="set"><div class="t"><b>Автообновление</b><span>проверка latest.json раз в сутки</span></div><span class="sw on" onclick="this.classList.toggle('on')"></span></div>
 <div class="set"><div class="t"><b>Восстановление сессии</b><span>вкладки и позиции при перезапуске</span></div><span class="sw on" onclick="this.classList.toggle('on')"></span></div>
 <div class="set"><div class="t"><b>Reader view по умолчанию</b><span>статьи открывать в режиме чтения</span></div><span class="sw" onclick="this.classList.toggle('on')"></span></div>`,
history:`<h1>История</h1><div class="sub">FTS5 + bm25 · 1 247 записей · в омнибоксе: @history</div><input type="search" placeholder="Полнотекстовый поиск по истории…"><div class="row"><span>🔎 rust borrow checker — StackOverflow</span><span class="u">сегодня 14:02</span></div><div class="row"><span>🔎 lumen release notes v0.4</span><span class="u">вчера</span></div><div class="row"><span>🔎 MDN: async/await</span><span class="u">3 дня назад</span></div><div class="row"><span>🔎 github.com/lumen-browser</span><span class="u">неделю назад</span></div>`,
bookmarks:`<h1>Закладки</h1><div class="sub">42 закладки · в омнибоксе: @bookmarks · cosine-rerank при AI</div><input type="search" placeholder="Поиск по закладкам…"><div class="row"><span>📌 rust-lang.org — nightly docs</span><span class="u">docs</span></div><div class="row"><span>📌 MDN — CSS Grid</span><span class="u">ref</span></div><div class="row"><span>📌 html.spec.whatwg.org</span><span class="u">spec</span></div>`,
downloads:`<h1>Загрузки</h1><div class="sub">менеджер загрузок: пауза / продолжить / открыть файл</div><div class="row"><div style="flex:1"><b>rust-toolchain.toml</b><div class="bar"><i style="width:64%"></i></div></div><span class="badge">64%</span></div><div class="row"><div style="flex:1"><b>spec-html.zip</b><div class="bar"><i style="width:31%;background:#1f9d55"></i></div></div><span class="badge">31%</span></div><div class="row"><span>✅ Lumen-0.5.0-windows.zip — 84 МБ</span><span class="u">завершена</span></div>`,
notes:`<h1>Заметки</h1><div class="sub">заметки, привязанные к страницам и фрагментам — @notes</div><div class="row"><div><b>Идея: командная строка как главный UI</b><div style="font-size:12px;color:#7d8590">к lumen.local · сегодня</div></div><span class="badge">правка</span></div><div class="row"><div><b>Проверить arena NodeId generation</b><div style="font-size:12px;color:#7d8590">к статье про движок</div></div><span class="badge">задача</span></div>`,
readlater:`<h1>Читать позже</h1><div class="sub">очередь статей · статусы и теги · @read-later</div><div class="row"><span>▤ «Inside the V8 engine» — видео</span><span class="badge">68%</span></div><div class="row"><span>▤ «Rust async in depth»</span><span class="badge">12%</span></div><div class="row"><span>▤ «CSS Anchor Positioning»</span><span class="badge">новая</span></div>`,
about:`<h1>О браузере</h1><div class="sub">Lumen — приватный лёгкий браузер на собственном движке</div><div class="row"><span>Версия</span><b style="margin-left:auto">${(document.querySelector('b')||{}).textContent||''}0.5.0</b></div><div class="row"><span>Движок</span><span class="u">own (Rust) · JS: V8 150</span></div><div class="row"><span>WPT</span><span class="u">44.80% corpus</span></div><div class="row"><span>Лицензия</span><span class="u">см. LICENSE</span></div>`,
privacy:`<h1>Приватность</h1><div class="sub">щиты, разрешения, Tor, GPC, fingerprint</div><div class="row"><span>🛡 Щиты</span><span class="badge">on</span></div><div class="row"><span>Sec-GPC: 1</span><span class="badge">on</span></div><div class="row"><span>HTTP-профиль</span><span class="badge">lumen</span></div><div class="row"><span>Tor</span><span class="badge">off</span></div><div class="row"><span>Блокировок сегодня</span><b style="margin-left:auto">214</b></div>`,
profiles:`<h1>Профили</h1><div class="sub">независимые наборы данных · profiles.db</div><div class="row"><span style="display:flex;gap:9px;align-items:center"><i style="width:12px;height:12px;border-radius:50%;background:#0066FF"></i><b>Личный</b></span><span class="u">12 вкладок · активен</span></div><div class="row"><span style="display:flex;gap:9px;align-items:center"><i style="width:12px;height:12px;border-radius:50%;background:#8B5CF6"></i><b>Рабочий</b></span><span class="u">8 вкладок</span></div><div class="row"><span style="display:flex;gap:9px;align-items:center"><i style="width:12px;height:12px;border-radius:50%;background:#FF3B30"></i><b>Анонимный</b></span><span class="u">без записи</span></div>`,
workspaces:`<h1>Пространства</h1><div class="sub">именованные группы вкладок · workspaces.db · Ctrl+Shift+W</div><div class="row"><span><i class="dot" style="width:10px;height:10px;border-radius:3px;background:#9aa3ad;display:inline-block"></i>Default</span><span class="u">4 вкладки</span></div><div class="row"><span><i style="width:10px;height:10px;border-radius:3px;background:#7c3aed;display:inline-block"></i>Работа</span><span class="u">5 вкладок · изоляция</span></div><div class="row"><span><i style="width:10px;height:10px;border-radius:3px;background:#0b6fe0;display:inline-block"></i>Дом</span><span class="u">3 вкладки · изоляция</span></div>`};
M.innerHTML=DATA[S]||DATA.home;
const Q=new URLSearchParams(location.search);
if(S==='go'){
  const u=Q.get('u'),q=Q.get('q');
  M.innerHTML=u?`<h1>🌐 ${u}</h1><div class="sub">Переход по адресу из омнибокса — в реальном браузере здесь загрузилась бы страница</div><div class="row"><span>Протокол</span><span class="u">https (auto)</span></div><div class="row"><span>Щиты</span><span class="badge">on</span></div><div class="row"><span>bfcache</span><span class="u">ready</span></div>`
   :`<h1>🔍 «${q}»</h1><div class="sub">FTS-поиск по истории, вкладкам, закладкам и заметкам (bm25)</div><div class="row"><span>История</span><span class="badge">12 совпадений</span></div><div class="row"><span>Вкладки</span><span class="badge">3</span></div><div class="row"><span>Закладки</span><span class="badge">2</span></div><div class="row"><span>Заметки</span><span class="badge">1</span></div>`;
}
if(S==='ai')M.innerHTML=`<h1>Lumen AI</h1><div class="sub">@ai — RAG-ответ по открытым вкладкам, истории и заметкам</div><div class="row"><span>Запрос попал из омнибокса</span><span class="u">@ai</span></div><div class="row"><span>Контекст</span><span class="badge">7 вкладок · 1.2k записей</span></div><div class="row"><span>Ответ</span><span class="u">локальная модель · без облака</span></div>`;
</script>
<script src="omni.js"></script>
<script src="chrome.js"></script>
</body>
</html>
