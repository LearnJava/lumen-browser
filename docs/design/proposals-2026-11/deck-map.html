<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Lumen — Колода: карта</title>
<style>
  :root{--bg:#0f1116;--panel:#171a20;--ink:#e8eaed;--mut:#8a919c;--line:#262b33;--acc:#5b9dff}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .top{height:42px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{font-weight:700}.brand span{color:var(--acc)}
  .omni{flex:1;max-width:460px;margin:0 auto;height:32px;display:flex;align-items:center;padding:0 14px;background:#0b0d10;border:1px solid var(--line);border-radius:16px;font-size:13px;color:var(--mut);cursor:pointer}
  .ib{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--mut);cursor:pointer;font-size:12.5px}
  .ib:hover{color:var(--ink);border-color:#3a4250}
  .layout{flex:1;display:flex;min-height:0}
  /* мини-карта колоды слева */
  .map{width:220px;flex:none;border-right:1px solid var(--line);overflow:auto;padding:14px;background:var(--panel)}
  .map h4{margin:0 0 10px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut)}
  .mi{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;margin-bottom:3px}
  .mi:hover{background:#1f242c}
  .mi.on{background:#1f2b45;border:1px solid var(--acc)}
  .fav{width:13px;height:13px;border-radius:3px;flex:none}
  .mi .u{font-size:10px;color:var(--mut);margin-left:auto}
  /* большая колода справа */
  .deck{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
  .card{width:min(560px,82%);height:min(460px,76vh);background:#fff;color:#222;border-radius:16px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.6);position:relative}
  .card .hd{height:36px;background:#f0f2f5;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #e4e6e8}
  .card .url{font-size:12px;color:#77809a;flex:1}
  .card .bd{height:calc(100% - 36px);overflow:auto;padding:24px}
  .card .bd .hero{height:120px;border-radius:10px;background:linear-gradient(120deg,#dfe6ee,#cfd8e3);margin-bottom:18px}
  .card .bd h1{font-size:21px;margin:0 0 10px}
  .card .bd p{font-size:14px;line-height:1.65;color:#333}
  .neighbors{position:absolute;top:50%;transform:translateY(-50%);width:min(200px,18%);height:min(340px,62vh);background:#2a2f37;border-radius:12px;opacity:.3;filter:blur(3px);transition:all .3s;z-index:0}
  .neighbors.l{left:2%}.neighbors.r{right:2%}
  .neighbors .fav{position:absolute;top:12px;left:12px;width:14px;height:14px;border-radius:4px}
  .dots{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
  .dots span{width:6px;height:6px;border-radius:50%;background:#3a4250;cursor:pointer}
  .dots span.on{background:var(--acc);transform:scale(1.4)}
  #tip{position:fixed;z-index:100;pointer-events:none;background:#0d1117;color:#e6e9ee;font-size:12px;line-height:1.4;padding:7px 10px;border-radius:8px;max-width:290px;border:1px solid #2a313c;box-shadow:0 6px 20px rgba(0,0,0,.5);display:none}
  #tip b{color:#8fb8ec}#tip kbd{background:#262b33;border-radius:4px;padding:0 5px;font:11px 'Segoe UI';margin-left:4px}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">lumen<span>://</span>deck-map</div>
    <div class="omni" data-tip="Адрес / @-команды" onclick="openPage('app.html?s=history')">🔍 lumen.local…</div>
    <button class="ib" data-tip="Все вкладки" onclick="openPage('app.html?s=home')">▦</button>
    <button class="ib" data-tip="Настройки" onclick="openPage('app.html?s=settings')">⚙</button>
  </div>
  <div class="layout">
    <aside class="map" id="map"></aside>
    <div class="deck" id="deck"></div>
  </div>
  <div class="dots" id="dots"></div>
  <div id="tip"></div>
<script>
function openPage(u){window.open(u,'_blank')}
const P=[
 {t:'Lumen — движок',u:'lumen.local/docs',c:'#e3a008',h:'Архитектура',b:'DOM-арена → layout → paint → V8. Потоковая загрузка.'},
 {t:'GitHub — lumen',u:'github.com/lumen',c:'#4285f4',h:'Репозиторий',b:'Код и issues. Работа в worktree-слотах.'},
 {t:'MDN — Grid',u:'mozilla.org',c:'#d93025',h:'CSS Grid',b:'Справочник · спит (T3).'},
 {t:'Подкаст',u:'youtube.com',c:'#34a853',h:'V8 и JIT',b:'Видео · PiP.'},
 {t:'V8 deep dive',u:'read-later',c:'#8b5cf6',h:'Inside V8',b:'68% прочитано.'},
 {t:'HTML Spec',u:'whatwg.org',c:'#fbbc05',h:'Standard',b:'Навигация и bfcache.'},
];
let cur=0;
const map=document.getElementById('map'),deck=document.getElementById('deck'),dots=document.getElementById('dots');
function render(){
  map.innerHTML='<h4>Колода · '+P.length+'</h4>'+P.map((p,i)=>`<div class="mi ${i===cur?'on':''}" data-tip="<b>${p.t}</b><br>${p.u}" onclick="cur=${i};render()"><span class="fav" style="background:${p.c}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${p.t}</span><span class="u">${p.u.split('/')[0]}</span></div>`).join('');
  const p=P[cur];
  deck.innerHTML=`
   <div class="neighbors l" data-tip="Предыдущая вкладка" onclick="cur=(cur-1+${P.length})%${P.length};render()"><span class="fav" style="background:${P[(cur-1+P.length)%P.length].c}"></span></div>
   <div class="neighbors r" data-tip="Следующая вкладка" onclick="cur=(cur+1)%${P.length};render()"><span class="fav" style="background:${P[(cur+1)%P.length].c}"></span></div>
   <div class="card" style="z-index:5"><div class="hd"><span class="fav" style="background:${p.c}"></span><span class="url">${p.u} · ${cur+1}/${P.length}</span></div><div class="bd"><div class="hero"></div><h1>${p.h}</h1><p>${p.b} Мини-карта слева показывает всю колоду — клик по строке переключает карту мгновенно.</p></div></div>`;
  dots.innerHTML=P.map((_,i)=>`<span class="${i===cur?'on':''}" onclick="cur=${i};render()"></span>`).join('');
}
function step(d){cur=(cur+d+P.length)%P.length;render()}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
const tip=document.getElementById('tip');
addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t)return;tip.innerHTML=t.dataset.tip;tip.style.display='block';});
addEventListener('mousemove',e=>{if(tip.style.display==='block'){tip.style.left=Math.min(e.clientX+14,innerWidth-300)+'px';tip.style.top=(e.clientY+16)+'px';}});
addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tip.style.display='none'});
render();
</script>
<script src="omni.js"></script>
<script src="chrome.js"></script>
</body>
</html>
