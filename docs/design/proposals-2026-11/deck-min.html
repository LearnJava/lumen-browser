<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Lumen — Колода: минимал</title>
<style>
  :root{--bg:#fdfdfd;--panel:rgba(255,255,255,.7);--ink:#1a1a1a;--mut:#8a8a8a;--line:#e8e8e8;--acc:#0b6fe0}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .top{height:36px;flex:none;display:flex;align-items:center;gap:6px;padding:0 12px;opacity:.35;transition:opacity .25s}
  body:hover .top{opacity:1}
  .brand{font-weight:700;font-size:13px}.brand span{color:var(--acc)}
  .omni{flex:1;max-width:480px;margin:0 auto;height:26px;display:flex;align-items:center;padding:0 12px;background:#fff;border:1px solid var(--line);border-radius:13px;font-size:12.5px;color:var(--mut);cursor:pointer}
  .omni:hover{border-color:#c9c9c9}
  .ib{width:26px;height:26px;border:none;background:none;border-radius:6px;color:var(--mut);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
  .ib:hover{background:#f0f0f0;color:var(--ink)}
  .ib svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .deck{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
  .card{width:min(680px,88vw);height:min(480px,80vh);background:#fff;border:1px solid var(--line);border-radius:4px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.06);transition:transform .3s,opacity .3s}
  .card .hd{height:32px;background:#fafafa;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
  .fav{width:13px;height:13px;border-radius:3px}
  .card .url{font-size:11.5px;color:#999;flex:1}
  .card .bd{height:calc(100% - 32px);overflow:auto;padding:32px;max-width:560px;margin:0 auto}
  .card .bd .hero{height:100px;background:#f5f5f5;border-radius:4px;margin-bottom:20px}
  .card .bd h1{font-size:22px;font-weight:400;margin:0 0 12px}
  .card .bd p{font-size:15px;line-height:1.7;color:#444}
  .neighbors{position:absolute;top:50%;transform:translateY(-50%);width:min(160px,14%);height:min(300px,56vh);background:#f5f5f5;border:1px solid var(--line);border-radius:4px;opacity:.25;transition:all .3s;z-index:0}
  .neighbors.l{left:2%}.neighbors.r{right:2%}
  .dots{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;opacity:0;transition:opacity .25s}
  body:hover .dots{opacity:1}
  .dots span{width:5px;height:5px;border-radius:50%;background:#ccc;cursor:pointer}
  .dots span.on{background:var(--acc)}
  #tip{position:fixed;z-index:100;pointer-events:none;background:#1a1a1a;color:#eee;font-size:12px;line-height:1.4;padding:6px 9px;border-radius:7px;max-width:280px;box-shadow:0 6px 20px rgba(0,0,0,.2);display:none}
  #tip b{color:#8fb8ec}#tip kbd{background:#333;border-radius:4px;padding:0 5px;font:11px 'Segoe UI';margin-left:4px}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">lumen<span>://</span>deck-min</div>
    <div class="omni" data-tip="Адрес / @-команды" onclick="openPage('app.html?s=history')">lumen.local</div>
    <button class="ib" data-tip="Назад"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button class="ib" data-tip="Вперёд"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
    <button class="ib" data-tip="Настройки"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.14-1.4l2-1.5-2-3.4-2.3 1a7 7 0 00-2.4-1.4L14 3h-4l-.36 2.6a7 7 0 00-2.4 1.4l-2.3-1-2 3.4 2 1.5a7 7 0 000 2.8l-2 1.5 2 3.4 2.3-1a7 7 0 002.4 1.4L10 21h4l.36-2.6a7 7 0 002.4-1.4l2.3 1 2-3.4-2-1.5c.09-.46.14-.93.14-1.4z"/></svg></button>
  </div>
  <div class="deck" id="deck"></div>
  <div class="dots" id="dots"></div>
  <div id="tip"></div>
<script>
function openPage(u){window.open(u,'_blank')}
const P=[
 {t:'Lumen — движок',u:'lumen.local/docs',c:'#e3a008',h:'Архитектура',b:'DOM-арена → layout → paint → V8. Минимализм: одна белая страница на чистом фоне, хром проявляется при наведении.'},
 {t:'GitHub — lumen',u:'github.com/lumen',c:'#4285f4',h:'Репозиторий',b:'Код и issues.'},
 {t:'MDN — Grid',u:'mozilla.org',c:'#d93025',h:'CSS Grid',b:'Справочник.'},
 {t:'Подкаст',u:'youtube.com',c:'#34a853',h:'V8 и JIT',b:'Видео.'},
 {t:'V8 deep dive',u:'read-later',c:'#8b5cf6',h:'Inside V8',b:'68%.'},
 {t:'HTML Spec',u:'whatwg.org',c:'#fbbc05',h:'Standard',b:'Навигация.'},
];
let cur=0;
const deck=document.getElementById('deck'),dots=document.getElementById('dots');
function render(){
  const p=P[cur];
  deck.innerHTML=`
   <div class="neighbors l" onclick="step(-1)"><span class="fav" style="position:absolute;top:12px;left:12px;width:14px;height:14px;border-radius:4px;background:${P[(cur-1+P.length)%P.length].c}"></span></div>
   <div class="neighbors r" onclick="step(1)"><span class="fav" style="position:absolute;top:12px;left:12px;width:14px;height:14px;border-radius:4px;background:${P[(cur+1)%P.length].c}"></span></div>
   <div class="card"><div class="hd"><span class="fav" style="background:${p.c}"></span><span class="url">${p.u}</span></div><div class="bd"><div class="hero"></div><h1>${p.h}</h1><p>${p.b}</p><p style="color:#999;font-size:13px">Хром виден только при наведении — чистая страница, ноль отвлечений.</p></div></div>`;
  dots.innerHTML=P.map((_,i)=>`<span class="${i===cur?'on':''}" onclick="cur=${i};render()"></span>`).join('');
}
function step(d){cur=(cur+d+P.length)%P.length;render()}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});
const tip=document.getElementById('tip');
addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t)return;tip.innerHTML=t.dataset.tip;tip.style.display='block';});
addEventListener('mousemove',e=>{if(tip.style.display==='block'){tip.style.left=Math.min(e.clientX+12,innerWidth-280)+'px';tip.style.top=(e.clientY+14)+'px';}});
addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tip.style.display='none'});
render();
</script>
<script src="omni.js"></script>
<script src="chrome.js"></script>
</body>
</html>
