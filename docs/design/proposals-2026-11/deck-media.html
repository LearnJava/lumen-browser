<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Lumen — Колода: медиа</title>
<style>
  :root{--bg:#101216;--panel:#171a20;--ink:#e8eaed;--mut:#8a919c;--line:#262b33;--acc:#5b9dff;--acc2:#e05a5a}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.5 'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  .top{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .brand{font-weight:700}.brand span{color:var(--acc)}
  .omni{flex:1;max-width:460px;margin:0 auto;height:32px;display:flex;align-items:center;padding:0 13px;background:#0b0d10;border:1px solid var(--line);border-radius:16px;font-size:13px;color:var(--mut);cursor:pointer}
  .ib{height:30px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--mut);cursor:pointer;font-size:12.5px}
  .ib:hover{color:var(--ink);border-color:#3a4250}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
  .card{width:min(680px,86vw);height:min(470px,74vh);background:#fff;color:#222;border-radius:16px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.6);transition:transform .3s,opacity .3s}
  .card .hd{height:36px;background:#f0f2f5;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid #e4e6e8}
  .fav{width:14px;height:14px;border-radius:4px}
  .card .url{font-size:12px;color:#77809a;flex:1}
  .card .bd{height:calc(100% - 36px);display:flex;overflow:hidden}
  /* медиа-часть */
  .media{flex:1.2;background:#0d1014;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;color:#fff}
  .media .art{width:120px;height:120px;border-radius:20px;background:linear-gradient(140deg,#5b9dff,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:48px;box-shadow:0 20px 50px rgba(91,157,255,.3)}
  .media .track{margin-top:22px;font-size:17px;font-weight:600;text-align:center}
  .media .artist{color:#8a919c;font-size:13px;margin-top:4px}
  .media .prog{width:80%;margin-top:24px;height:6px;border-radius:3px;background:#262b33;overflow:hidden}
  .media .prog i{display:block;height:100%;background:var(--acc);width:42%}
  .media .times{width:80%;display:flex;justify-content:space-between;font-size:11px;color:#8a919c;margin-top:6px}
  .media .ctrl{display:flex;gap:18px;margin-top:20px}
  .media .ctrl button{width:42px;height:42px;border-radius:50%;border:none;background:#262b33;color:#fff;cursor:pointer;font-size:16px}
  .media .ctrl button.pri{background:var(--acc);width:52px;height:52px;font-size:20px}
  .media .ctrl button:hover{background:#3a4250}
  .media .ctrl button.pri:hover{background:#7ab3ff}
  .live{position:absolute;top:14px;right:14px;background:var(--acc2);color:#fff;font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:10px}
  .card .side{flex:1;background:#f7f8fa;padding:20px;font-size:13px;color:#444;line-height:1.6;overflow:auto;border-left:1px solid #eee}
  .card .side h4{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#8a919c}
  .card .side .it{padding:8px 0;border-bottom:1px solid #eee;cursor:pointer}
  .card .side .it:hover{color:var(--acc)}
  .strip{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:10}
  .strip .m{width:64px;height:44px;border-radius:8px;background:#2a2f37;border:1px solid var(--line);cursor:pointer;overflow:hidden;opacity:.5;transition:all .2s}
  .strip .m.on{opacity:1;border-color:var(--acc);box-shadow:0 0 0 2px rgba(91,157,255,.3)}
  .strip .m .a{height:100%;background:linear-gradient(140deg,#5b9dff,#8b5cf6)}
  .strip .m .a2{height:100%;background:linear-gradient(140deg,#3fb96f,#5b9dff)}
  .strip .m .a3{height:100%;background:linear-gradient(140deg,#e8a33d,#e05a5a)}
  #tip{position:fixed;z-index:100;pointer-events:none;background:#0d1117;color:#e6e9ee;font-size:12px;line-height:1.4;padding:7px 10px;border-radius:8px;max-width:290px;border:1px solid #2a313c;box-shadow:0 6px 20px rgba(0,0,0,.5);display:none}
  #tip b{color:#8fb8ec}#tip kbd{background:#262b33;border-radius:4px;padding:0 5px;font:11px 'Segoe UI';margin-left:4px}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">lumen<span>://</span>deck-media</div>
    <div class="omni" data-tip="Адрес / @-команды" onclick="openPage('app.html?s=history')">🔍 lumen.local…</div>
    <button class="ib" data-tip="Все вкладки" onclick="openPage('app.html?s=home')">▦</button>
    <button class="ib" data-tip="PiP — видео поверх окон" onclick="openPage('app.html?s=home')">📺 PiP</button>
    <button class="ib" data-tip="Настройки" onclick="openPage('app.html?s=settings')">⚙</button>
  </div>
  <div class="stage" id="st"></div>
  <div class="strip" id="strip"></div>
  <div id="tip"></div>
<script>
function openPage(u){window.open(u,'_blank')}
const M=[
 {t:'Подкаст ep.42',u:'youtube.com/watch',c:'#34a853',cls:'a',name:'Эпизод 42 — V8 и JIT',artist:'Технический подкаст · 58:12',prog:42,live:1,side:'Обсуждение V8, JIT-компиляции и сравнение с другими runtime.'},
 {t:'Микс — lo-fi',u:'youtube.com/watch',c:'#f00',cls:'a2',name:'lo-fi beats',artist:'фон для работы · LIVE',prog:0,live:1,side:'Фоновое воспроизведение — можно свести в PiP.'},
 {t:'Доклад — Rust async',u:'youtube.com/watch',c:'#fbbc05',cls:'a3',name:'Async Rust deep dive',artist:'конференция · 1:24:00',prog:68,side:'Executor-модели: tokio, smol, futures.'},
];
let cur=0,playing=true;
const st=document.getElementById('st'),strip=document.getElementById('strip');
function render(){
  const m=M[cur];
  st.innerHTML=`<div class="card"><div class="hd"><span class="fav" style="background:${m.c}"></span><span class="url">${m.u} · ${cur+1}/${M.length}</span></div>
   <div class="bd">
    <div class="media"><span class="live">${m.live?'LIVE':'▶'}</span>
     <div class="art">🎧</div>
     <div class="track">${m.name}</div><div class="artist">${m.artist}</div>
     <div class="prog"><i style="width:${m.prog}%"></i></div>
     <div class="times"><span>${Math.floor(m.prog*0.6)}:${String(Math.floor(m.prog*0.6*10)%10)}0</span><span>1:00:00</span></div>
     <div class="ctrl"><button data-tip="Предыдущий трек">⏮</button><button class="pri" data-tip="${playing?'Пауза':'Играть'} — <kbd>Space</kbd>" onclick="playing=!playing;render()">${playing?'⏸':'▶'}</button><button data-tip="Следующий трек">⏭</button><button data-tip="PiP — вынести видео поверх окон" onclick="openPage('app.html?s=home')">📺</button></div>
    </div>
    <div class="side"><h4>О странице</h4><div class="it" data-tip="Комментарии" onclick="openPage('app.html?s=home')">💬 Комментарии · 1.2k</div><div class="it" data-tip="Похожие видео" onclick="openPage('app.html?s=home')">🎬 Похожие · 24</div><div class="it" data-tip="В закладки" onclick="openPage('app.html?s=bookmarks')">📌 В закладки</div><p>${m.side}</p></div>
   </div></div>`;
  strip.innerHTML=M.map((x,i)=>`<div class="m ${i===cur?'on':''}" data-tip="<b>${x.t}</b><br>${x.name}" onclick="cur=${i};render()"><div class="${x.cls}" style="height:100%"></div></div>`).join('');
}
function step(d){cur=(cur+d+M.length)%M.length;render()}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1);if(e.key===' ')e.preventDefault()});
const tip=document.getElementById('tip');
addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(!t)return;tip.innerHTML=t.dataset.tip;tip.style.display='block';});
addEventListener('mousemove',e=>{if(tip.style.display==='block'){tip.style.left=Math.min(e.clientX+14,innerWidth-300)+'px';tip.style.top=(e.clientY+16)+'px';}});
addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]'))tip.style.display='none'});
render();
</script>
<script src="omni.js"></script>
<script src="chrome.js"></script>
</body>
</html>
