# sccache — кэширует результаты компиляции между сборками (в том числе чистыми).
# Особенно полезен при пересборке после git clean или смене веток.
#
# ТРЕБУЕТСЯ sccache >= 0.17.0. Версия 0.15.0 несовместима с тулчейном 1.97.0:
# КАЖДЫЙ вызов компилятора через обёртку падал с
#   process didn't exit successfully: `sccache ... rustc.exe ...`
#   (exit code: 0xc0000409, STATUS_STACK_BUFFER_OVERRUN)
# на крейтах с длинной командной строкой — и на clippy-driver, и на обычном
# rustc, то есть ломалась сборка вообще, а не только линт. Из-за этого обёртка
# была ОТКЛЮЧЕНА 2026-08-19 (пин тулчейна был важнее) и ВОЗВРАЩЕНА 2026-09-01
# после `cargo install sccache --version 0.17.0`: оба падавших сценария зелёные
# (`cargo test -p lumen-layout` после `cargo clean -p lumen-layout` — 3729 тестов,
# 35 компиляций через обёртку, 0 сбоев; `cargo clippy -p lumen-driver
# --all-targets -- -D warnings` — exit 0). Кэш работает, не только «не падает»:
# повторный clean+build внешних зависимостей даёт 100% hit. Замеры —
# docs/build-speed.md §7.
#
# Если обёртку придётся снова выключить — не оставляй это комментарием здесь,
# оформляй ADR (docs/decisions/), потому что это уже осознанный отказ от меры,
# заявленной в §1 docs/build-speed.md как несущей.
#
# Свои крейты workspace сборка не кэширует: в dev/dev-release включён
# `incremental = true`, а инкрементальные компиляции sccache объявляет
# non-cacheable («Non-cacheable reasons: incremental»). Выигрыш — на
# зависимостях, то есть на свежем worktree и после `cargo clean`.
#
# В CI обёртка отключена (`RUSTC_WRAPPER: ""` в .github/workflows/*.yml) —
# на раннерах sccache нет; это не меняется.
[build]
rustc-wrapper = "sccache"

# Порт sccache-сервера. Дефолтный 4226 попадает в зарезервированный Windows
# диапазон port exclusion (winnat/Hyper-V/WSL), из-за чего сервер не стартует
# (os error 10013). Резервы плавают между перезагрузками: 4150 (щель 4091–4190
# на 2026-07-12) к 2026-08-11 накрыт диапазоном 4134–4233, и любая сборка падала
# на «Server startup failed: A Windows port exclusion is blocking use of the
# configured port». 4444 лежит в свободной щели 4234–5356.
# Если ошибка вернётся после перезагрузки — проверь актуальные резервы:
#   netsh interface ipv4 show excludedportrange protocol=tcp
# и подбери порт вне всех диапазонов.
[env]
SCCACHE_SERVER_PORT = "4444"
# НЕ добавлять CC/CXX = "sccache cl": вне VS-окружения cl.exe не в PATH,
# sccache его не находит ("cannot find binary path"), а путь к cl.exe
# содержит пробелы и в CC не передаётся. Проверено 2026-07-12 —
# docs/build-speed.md §3.3.

# rust-lld — встроенный в Rust LLVM-линковщик.
# На Windows MSVC быстрее link.exe примерно в 2–5 раз на финальной линковке
# (особенно заметно при --release: там линковка занимает 30–60% от всего времени).
# Доступен начиная с Rust 1.86 stable на x86_64-pc-windows-msvc.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

# Rust по умолчанию jobs = число логических ядер — обычно опмально.
# При необходимости раскомментируй и задай явное число:
# [build]
# jobs = 8