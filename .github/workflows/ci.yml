name: CI

# Cross-platform compilation check + unit tests on every push/PR to main.
# Graphic tests (gdigrab + Edge comparison) are Windows-only and run separately.

on:
  push:
    # `p[1-5]-*` are the role task branches (CLAUDE.md §Git workflow). They are
    # pushed to origin so CI can gate them BEFORE the local `--no-ff` merge —
    # without this pattern a branch push runs nothing, because the project
    # merges locally and does not open pull requests (docs/ci-offload.md §8,
    # variant 1, decided 2026-08-18).
    branches: [main, 'p[1-5]-*']
    tags-ignore: ['**']   # release.yml handles tags
  pull_request:

# One run per branch. A second push supersedes the first: with branch gating a
# task branch gets pushed several times, and 20-minute runs would otherwise pile
# up against the 20-job free-tier limit. `main` is exempt — every commit that
# lands there keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Репозиторный .cargo/config.toml задаёт `build.rustc-wrapper = "sccache"`
  # (он несущий локально, docs/build-speed.md). На раннерах sccache нет, и
  # ЛЮБАЯ команда cargo падает мгновенно: «could not execute process `sccache
  # ... rustc -vV` (never executed)». Пустой RUSTC_WRAPPER перебивает config и
  # отключает обёртку — проверено A/B по счётчику `sccache --show-stats`.
  # Не заменять установкой sccache в CI: docs/ci-offload.md §5 — он решает ту же
  # задачу, что и кэш зависимостей, но требует внешнего хранилища.
  RUSTC_WRAPPER: ""

jobs:
  check:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # `tests/wpt` is 105 702 of the 108 534 tracked files (vendored WPT) and no
      # build job needs it — skipping it is the single biggest checkout saving.
      # cone-mode must be off: the pattern is an exclusion, not a directory list.
      # A job that does need WPT (future `doc-drift`, ci-offload.md §4) checks out
      # normally instead.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            /*
            !/tests/wpt
          sparse-checkout-cone-mode: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Do NOT cache `target/` wholesale: it is 38 GiB locally against a 10 GB
      # per-repository budget, and the previous three-key-per-OS scheme guaranteed
      # mutual eviction and a zero hit rate. `rust-cache` keeps dependency
      # artifacts and drops workspace-crate ones, which is what actually fits.
      # Third-party action — pinned by commit SHA, not by tag (ci-offload.md §5).
      # `save-if` writes the cache only on `main`; task-branch runs restore from
      # the base branch, so five parallel roles do not split the 10 GB budget.
      - name: Cargo dependency cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # rusty_v8 drops its ~220 MB prebuilt static library here
          # (docs/build-speed.md §3.7); without it every cold job re-downloads it.
          cache-directories: ~/.cargo/.rusty_v8

      # glutin (OpenGL context) and winit need X11/Wayland/EGL headers on Linux;
      # cpal/rodio (crates/shell audio) map to ALSA there, so alsa-sys needs
      # libasound2-dev — without it the build script fails, Linux only.
      # rusqlite uses "bundled" so no libsqlite3 required.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libwayland-dev libxkbcommon-dev \
            libegl-dev libgles2-mesa-dev \
            libasound2-dev \
            pkg-config

      # Verify the main shell binary compiles on all platforms.
      # This catches cross-platform breakage early without waiting for a full release build.
      - name: Compile check (lumen-shell)
        run: cargo check -p lumen-shell

      # Run unit tests for crates that have no windowing/GPU requirements.
      # lumen-shell and lumen-paint (with GPU backends) are excluded here.
      - name: Unit tests — core + parsers
        run: |
          cargo test -p lumen-core
          cargo test -p lumen-html-parser
          cargo test -p lumen-css-parser
          cargo test -p lumen-dom

      - name: Unit tests — engine
        run: |
          cargo test -p lumen-layout
          cargo test -p lumen-font
          cargo test -p lumen-encoding
          cargo test -p lumen-image

      - name: Unit tests — services
        run: |
          cargo test -p lumen-js
          cargo test -p lumen-network
          cargo test -p lumen-storage
          cargo test -p lumen-ipc
          cargo test -p lumen-knowledge
