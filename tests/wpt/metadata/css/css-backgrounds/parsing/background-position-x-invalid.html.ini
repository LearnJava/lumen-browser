# Known engine gap, tracked as BUG-484: the inline `element.style` setter
# (`_lumen_make_style`, crates/js/src/dom.rs) never routes through the real
# CSS parser -- invalid values are accepted verbatim instead of rejected,
# shorthands never expand into longhands, and valid values are echoed
# back raw instead of canonicalized. The same Proxy also lacks
# Symbol.iterator/length (same missing-trap class as BUG-483's
# getComputedStyle Proxy), breaking code that iterates element.style.
# Observed via the structured wptreport (WPT-RUN-3 sl.9, css/css-backgrounds
# mass run). Re-run and flip to PASS once BUG-484 lands.

