# Known engine gap, tracked as BUG-472: `getComputedStyle()` resolved-value
# coverage gaps -- `computed_style_to_map` (selector_query.rs) is a
# hand-written ~64-entry map; any property outside it (background-*
# longhands, border-*-color/-style/-width/-radius longhands, the
# border-width shorthand) silently returns "" instead of the resolved
# value, even though the property is implemented for real rendering.
# Observed via the structured wptreport (WPT-RUN-3 sl.9, css/css-backgrounds
# mass run). Re-run and flip to PASS once BUG-472 lands.

