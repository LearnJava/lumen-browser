# BUG-495 landed the parse/apply/serialize wiring (verified: layout unit
# tests + live probe confirm the map key resolves the true axis value once a
# relayout has run). All remaining FAILs below are BUG-493, not BUG-495: this
# test sets the inline style and reads getComputedStyle in the SAME
# synchronous script tick, and `getComputedStyle()` never forces a
# synchronous restyle/relayout before reading its cache (ДОРАБОТКА ->
# CSSOM-4) -- so every read below sees the pre-mutation snapshot, not the
# just-set value. `[Property ... 'left']` only passes because the untouched
# default ('0%' pre-mutation) happens to equal 'left''s expected computed
# value ('0%') -- confirmed live: a same-tick set/read of 'center' returns
# stale '0%', while the identical set followed by a read across a relayout
# boundary correctly returns '50%'. Re-run and flip to PASS once BUG-493
# lands.

