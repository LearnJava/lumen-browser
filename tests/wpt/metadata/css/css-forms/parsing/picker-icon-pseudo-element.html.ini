# Known engine gap, tracked as BUG-485: document.head is entirely missing
# (no getter, no native binding) -- the shared helper
# css/support/parsing-testcommon.js::test_valid_selector does
# `document.head.append(style)` as its second step, so every "should be a
# valid selector" subtest throws TypeError before reaching the actual
# selector-validity/serialization assertions.
#
# Known engine gap, tracked as BUG-391: querySelector()/insertRule() never
# throw SyntaxError for a selector that is grammatically well-formed per
# each individual pseudo-element's own grammar but structurally invalid
# (combinator or another pseudo-element following a pseudo-element) -- every
# "should be an invalid selector" subtest here expects a throw that never
# happens.
#
# Observed via the structured wptreport (WPT-RUN-3 sl.16, css/css-forms mass
# run). Re-run and flip to PASS once BUG-485/BUG-391 land.

[picker-icon-pseudo-element.html]
