  ["::before::picker-icon" should be an invalid selector]
    expected: FAIL
  ["::after::picker-icon" should be an invalid selector]
    expected: FAIL
  ["::marker::picker-icon" should be an invalid selector]
    expected: FAIL
  ["::placeholder::picker-icon" should be an invalid selector]
