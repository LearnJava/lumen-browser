# Known engine gap, tracked as BUG-485: document.head is entirely missing
# (no getter, no native binding) -- the shared helper
# css/support/parsing-testcommon.js::test_valid_selector does
# `document.head.append(style)` as its second step, so every "should be a
# valid selector" subtest throws TypeError before reaching the actual
# selector-validity/serialization assertions.
#
# Known engine gap, tracked as BUG-391: querySelector()/insertRule() never
# throw SyntaxError for a selector that is grammatically well-formed per
# each individual pseudo-element's own grammar but structurally/argument-wise
# invalid -- a combinator or another pseudo-element following ::picker(),
# and an out-of-range functional argument (::picker(foo), ::picker(),
# bare ::picker) all fail to throw. crates/engine/css-parser/src/parser.rs's
# "picker" arm accepts any non-empty ident as the argument instead of
# restricting it to the single spec-defined value "select".
#
# Observed via the structured wptreport (WPT-RUN-3 sl.16, css/css-forms mass
# run). Re-run and flip to PASS once BUG-485/BUG-391 land.

[picker-select-pseudo-element.html]
  ["::picker(select)" should be a valid selector]
    expected: FAIL
  ["*::picker(select)" should be a valid selector]
    expected: FAIL
  ["foo.bar[baz\]::picker(select)" should be a valid selector]
    expected: FAIL
  ["::picker(select) *" should be an invalid selector]
    expected: FAIL
  ["::picker(foo)" should be an invalid selector]
    expected: FAIL
  ["::picker()" should be an invalid selector]
    expected: FAIL
  ["::picker" should be an invalid selector]
    expected: FAIL
  ["::picker(SELECT)" should be a valid selector]
    expected: FAIL
  ["::picker(select)::picker(select)" should be a valid selector]
    expected: FAIL
  ["::before::picker(select)" should be an invalid selector]
    expected: FAIL
  ["::after::picker(select)" should be an invalid selector]
    expected: FAIL
  ["::marker::picker(select)" should be an invalid selector]
    expected: FAIL
  ["::placeholder::picker(select)" should be an invalid selector]
    expected: FAIL
  ["::picker(select)::before" should be a valid selector]
    expected: FAIL
  ["::picker(select)::after" should be a valid selector]
    expected: FAIL
  ["::picker(select)::marker" should be a valid selector]
    expected: FAIL
  ["::picker(select)::placeholder" should be a valid selector]
    expected: FAIL
  ["::slotted(*)::picker(select)::slotted(*)" should be an invalid selector]
    expected: FAIL
  ["::slotted(*)::picker(select)" should be a valid selector]
    expected: FAIL
  ["::part(foo)::picker(select)" should be a valid selector]
    expected: FAIL
