# P3 revision 2026-09-05 (BUG-514): env() substitution itself is correctly
# implemented (see substitute.rs). Every subtest here creates a `<div>` via
# `document.createElement`, sets `elem.style.cssText`, then reads
# `getComputedStyle(elem)` in the same script tick -- confirmed live that
# even the plain-color (no env() at all) baseline case fails identically,
# so the root cause is BUG-493/CSSOM-4 (getComputedStyle never forces a
# flush, script-created nodes read back empty), not env(). Re-run and flip
# to PASS once CSSOM-4/BUG-493 lands.


[syntax.tentative.html]
  [ rgb(0, 128, 0)]
    expected: FAIL
