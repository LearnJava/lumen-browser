# Known engine gap, tracked as BUG-514: the `env()` CSS function (CSS
# Environment Variables L1) is not recognized anywhere in css-parser -- a
# declaration/condition containing `env(...)` never resolves.
# Observed via the structured wptreport (WPT-RUN-3 sl.21, css/css-link-
# params + css-forced-color-adjust + css-size-adjust + css-device-adapt +
# css-env + css-overscroll-behavior mass run). Re-run and flip to PASS
# once the bug lands.


[syntax.tentative.html]
  [ rgb(0, 128, 0)]
    expected: FAIL
  [background-color: env(test) rgba(0, 0, 0, 0)]
    expected: FAIL
  [background-color: ENV(test) rgba(0, 0, 0, 0)]
    expected: FAIL
  [background-color: env(test) !important rgba(0, 0, 0, 0)]
    expected: FAIL
  [background-color: env(test, 10px) rgba(0, 0, 0, 0)]
    expected: FAIL
  [background-color: env(test, blue) rgb(0, 0, 255)]
    expected: FAIL
  [background-color: env(test, env(another)) rgba(0, 0, 0, 0)]
    expected: FAIL
  [background-color: env(test, env(another, blue)) rgb(0, 0, 255)]
    expected: FAIL
  [background-color: env(-test) rgba(0, 0, 0, 0)]
    expected: FAIL
  [background-color: env(--test) rgba(0, 0, 0, 0)]
    expected: FAIL
  [background-color: env(10px) rgb(0, 128, 0)]
    expected: FAIL
  [background-color: env(env(test)) rgb(0, 128, 0)]
    expected: FAIL
  [background-color: env( test) rgba(0, 0, 0, 0)]
    expected: FAIL
  [background-color: env(test ) rgba(0, 0, 0, 0)]
