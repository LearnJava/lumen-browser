# BUG-563: the inline-style CSSOM getter/setter (_lumen_make_style,
# crates/js/src/dom.rs) is a raw-text passthrough for anchor()/
# anchor-size()/position-area values — it never invokes the real value
# parser (layout/src/style.rs::parse_anchor_func etc.) or any serializer
# (none exists for AnchorFunc/AnchorSizeFunc/InsetAreaKeyword,
# layout/src/anchor.rs). One root cause explains two symptoms: invalid
# values wrongly round-trip verbatim instead of being rejected, and valid
# values echo back in the author's original keyword/argument order
# instead of the spec-canonical one.
# WPT-RUN-3 slice 42 (ROADMAP.md) mass run — file-level TIMEOUT resolved
# by the testharnessreport.js timeout_multiplier fix (this slice); real
# per-subtest results available for the first time (previously pinned as
# a blanket file-level `expected: TIMEOUT`, slice 30).
# Re-run and flip to PASS once BUG-563 lands.

