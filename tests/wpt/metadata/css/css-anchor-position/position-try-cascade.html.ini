# BUG-562: `position-try`/`position-try-fallbacks`/`position-try-order`/
# `@position-try` (CSSPositionTryRule) are not implemented at all; scripts
# that touch them abort synchronously, leaving later `var`/`let` bindings
# unset (ReferenceError) or subtests entirely unreached (NOTRUN).
# WPT-RUN-3 slice 40 mass run (structured wptreport JSON).
# Re-run and flip to PASS once the cited bug(s) land.

[position-try-cascade.html]
  [@position-try rule applies]
    expected: FAIL
  [@position-try rule wins over inline style]
    expected: FAIL
  [@position-try rule does not win over !important]
    expected: FAIL
  [@position-try rule does not win over animations]
    expected: FAIL
  [@position-try rule does not win over transitions]
    expected: FAIL
  [@position-try revert / revert-layer reverts to user / author origin]
    expected: FAIL
