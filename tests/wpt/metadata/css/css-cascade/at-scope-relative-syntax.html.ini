# Known engine gap, tracked as BUG-384: named access on Window is
# incomplete/incorrect -- a bare identifier referencing an element by its
# `id` attribute (e.g. `main`, `el`, `target1`) throws ReferenceError
# instead of resolving through the Window named-access mechanism. Observed
# end to end by wptrunner (WPT-RUN-3 sl.6, css/css-cascade mass run).
# Re-run and flip to PASS once BUG-384 lands.


[at-scope-relative-syntax.html]
  expected: ERROR
  [> .foo in @scope,.nest created by string valid]
    expected: FAIL
  [> .foo in .nest,@scope created by string valid]
    expected: NOTRUN
  [> .foo in @scope,.nest,@media screen created by string valid]
    expected: NOTRUN
  [> .foo in .nest,@scope,@media screen created by string valid]
    expected: NOTRUN
  [> .foo in @scope,.nest created by insertRule valid]
    expected: NOTRUN
  [> .foo in .nest,@scope created by insertRule valid]
    expected: NOTRUN
  [> .foo in @scope,.nest,@media screen created by insertRule valid]
    expected: NOTRUN
  [> .foo in .nest,@scope,@media screen created by insertRule valid]
    expected: NOTRUN
