[scope-specificity.html]
  [@scope (#main) { & .b {  } } and :where(#main) .b]
    expected: FAIL

  [@scope (#main) { @scope (.a) { .b {  } } } and .b]
    expected: FAIL

  [@scope { & .b {  } } and :where(:scope) .b]
    expected: FAIL

  [@scope (#main) { > .a {  } } and :where(#main) > .a]
    expected: FAIL
