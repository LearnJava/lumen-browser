# Known engine gap, tracked as BUG-384: named access on Window is
# incomplete/incorrect -- a bare identifier referencing an element by its
# `id` attribute (e.g. `main`, `el`, `target1`) throws ReferenceError
# instead of resolving through the Window named-access mechanism. Observed
# end to end by wptrunner (WPT-RUN-3 sl.6, css/css-cascade mass run).
# Re-run and flip to PASS once BUG-384 lands.


[scope-specificity.html]
  [@scope (#main) { .b {  } } and .b]
    expected: FAIL
  [@scope (#main) to (.b) { .a {  } } and .a]
    expected: FAIL
  [@scope (#main, .foo, .bar) { #a {  } } and #a]
    expected: FAIL
  [@scope (#main) { div.b {  } } and div.b]
    expected: FAIL
  [@scope (#main) { :scope .b {  } } and .a .b]
    expected: FAIL
  [@scope (#main) { & .b {  } } and :where(#main) .b]
    expected: FAIL
  [@scope (#main) { div .b {  } } and div .b]
    expected: FAIL
  [@scope (#main) { @scope (.a) { .b {  } } } and .b]
    expected: FAIL
  [@scope (#main) { :scope .b {  } } and :scope .b]
    expected: FAIL
