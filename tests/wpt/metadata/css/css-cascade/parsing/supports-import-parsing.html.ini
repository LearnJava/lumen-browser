# New engine gap, tracked as BUG-485: document.head is entirely missing --
# no getter, no native binding -- so document.head.appendChild/.append
# throws TypeError on undefined. Observed end to end by wptrunner
# (WPT-RUN-3 sl.6, css/css-cascade mass run). Re-run and flip to PASS once
# BUG-485 lands.


[supports-import-parsing.html]
  [@import url("nonexist.css") supports(); should be an invalid import rule due to an invalid supports() declaration]
    expected: FAIL
  [@import url("nonexist.css") supports(foo: bar); should be an invalid import rule due to an invalid supports() declaration]
    expected: FAIL
  [@import url("nonexist.css") supports(display:block); should be a valid supports() import rule]
    expected: FAIL
  [@import url("nonexist.css") supports((display:flex)); should be a valid supports() import rule]
    expected: FAIL
  [@import url("nonexist.css") supports(not (display: flex)); should be a valid supports() import rule]
    expected: FAIL
  [@import url("nonexist.css") supports((display: flex) and (display: block)); should be a valid supports() import rule]
    expected: FAIL
  [@import url("nonexist.css") supports((display: flex) or (display: block)); should be a valid supports() import rule]
    expected: FAIL
  [@import url("nonexist.css") supports((display: flex) or (foo: bar)); should be a valid supports() import rule]
    expected: FAIL
  [@import url("nonexist.css") supports(display: block !important); should be a valid supports() import rule]
    expected: FAIL
  [@import url("nonexist.css") layer supports(); should be an invalid import rule due to an invalid supports() declaration]
    expected: FAIL
  [@import url("nonexist.css") layer supports(foo: bar); should be an invalid import rule due to an invalid supports() declaration]
    expected: FAIL
  [@import url("nonexist.css") layer(A) supports((display: flex) or (foo: bar)); should be a valid supports() import rule]
    expected: FAIL
  [@import url("nonexist.css") layer(A.B) supports((display: flex) and (foo: bar)); should be a valid supports() import rule]
    expected: FAIL
  [@import url("nonexist.css") supports(selector(a)); should be a valid supports() import rule]
    expected: FAIL
  [@import url("nonexist.css") supports(selector(p a)); should be a valid supports() import rule]
    expected: FAIL
  [@import url("nonexist.css") supports(selector(p > a)); should be a valid supports() import rule]
    expected: FAIL
  [@import url("nonexist.css") supports(selector(p + a)); should be a valid supports() import rule]
    expected: FAIL
  [@import url("nonexist.css") supports(font-tech(color-colrv1)); should be a valid supports() import rule]
    expected: FAIL
  [@import url("nonexist.css") supports(font-format(opentype)); should be a valid supports() import rule]
    expected: FAIL
  [@import url(nonexist.css) supports(display:block); should be a valid supports() import rule]
    expected: FAIL
  [@import "nonexist.css" supports(display:block); should be a valid supports() import rule]
    expected: FAIL
  [@import url("nonexist.css") supports; should still be a valid import rule with an invalid supports() declaration]
    expected: FAIL
