# Known engine gap, tracked as BUG-384: named access on Window is
# incomplete/incorrect -- a bare identifier referencing an element by its
# `id` attribute (e.g. `main`, `el`, `target1`) throws ReferenceError
# instead of resolving through the Window named-access mechanism. Observed
# end to end by wptrunner (WPT-RUN-3 sl.6, css/css-cascade mass run).
# Re-run and flip to PASS once BUG-384 lands.


[at-scope-parsing.html]
  expected: ERROR
  [@scope (.a) is valid]
    expected: FAIL
  [@scope (.a + .b) is valid]
    expected: NOTRUN
  [@scope (.a:hover) is valid]
    expected: NOTRUN
  [@scope (.a:hover, #b, div) is valid]
    expected: NOTRUN
  [@scope (:is(div, span)) is valid]
    expected: NOTRUN
  [@scope (.a) to (.b) is valid]
    expected: NOTRUN
  [@scope (.a)to (.b) is valid]
    expected: NOTRUN
  [@scope (.a) to (.b:hover, #c, div) is valid]
    expected: NOTRUN
  [@scope is valid]
    expected: NOTRUN
  [@scope to (.a) is valid]
    expected: NOTRUN
  [@scope (.a) to (&) is valid]
    expected: NOTRUN
  [@scope (.a) to (& > &) is valid]
    expected: NOTRUN
  [@scope (.a) to (> .b) is valid]
    expected: NOTRUN
  [@scope (.a) to (+ .b) is valid]
    expected: NOTRUN
  [@scope (.a) to (~ .b) is valid]
    expected: NOTRUN
  [@scope () is not valid]
    expected: NOTRUN
  [@scope to () is not valid]
    expected: NOTRUN
  [@scope () to () is not valid]
    expected: NOTRUN
  [@scope (.c <> .d) is not valid]
    expected: NOTRUN
  [@scope (.a, .c <> .d) is not valid]
    expected: NOTRUN
  [@scope (.a <> .b, .c) is not valid]
    expected: NOTRUN
  [@scope (div::before) is not valid]
    expected: NOTRUN
  [@scope (div::after) is not valid]
    expected: NOTRUN
  [@scope (slotted(div)) is not valid]
    expected: NOTRUN
  [@scope (.a) to (div::before) is not valid]
    expected: NOTRUN
  [@scope (> &) to (>>) is not valid]
    expected: NOTRUN
  [@scope div is not valid]
    expected: NOTRUN
  [@scope (.a) unknown (.c) is not valid]
    expected: NOTRUN
  [@scope (.a) to unknown (.c) is not valid]
    expected: NOTRUN
  [@scope (.a) 1px (.c) is not valid]
    expected: NOTRUN
  [@scope (.a) to unknown(c) is not valid]
    expected: NOTRUN
  [@scope unknown(.a) is not valid]
    expected: NOTRUN
  [@scope 1px is not valid]
    expected: NOTRUN
  [@scope creep is not valid]
    expected: NOTRUN
  [@scope ))) is not valid]
    expected: NOTRUN
  [@scope ( is not valid]
    expected: NOTRUN
  [@scope ( {} is not valid]
    expected: NOTRUN
  [@scope to is not valid]
    expected: NOTRUN
  [@scope } is not valid]
    expected: NOTRUN
  [@scope (.a is not valid]
    expected: NOTRUN
  [@scope (.a to (.b) is not valid]
    expected: NOTRUN
  [@scope ( to (.b) is not valid]
    expected: NOTRUN
  [@scope (.a) from (.c) is not valid]
    expected: NOTRUN
