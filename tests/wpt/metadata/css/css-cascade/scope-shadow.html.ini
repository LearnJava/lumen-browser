# incomplete/incorrect -- a bare identifier referencing an element by its
# `id` attribute (e.g. `main`, `el`, `target1`) throws ReferenceError
# instead of resolving through the Window named-access mechanism. Observed
# end to end by wptrunner (WPT-RUN-3 sl.6, css/css-cascade mass run).
# Re-run and flip to PASS once BUG-384 lands.


[scope-shadow.html]
  [@scope can match :host]
    expected: FAIL
  [@scope can match :host(...)]
    expected: FAIL
  [:scope matches host via the scoping root]
    expected: FAIL
  [:scope within :is() matches host via the scoping root]
    expected: FAIL
  [Implicit @scope as direct child of shadow root]
    expected: FAIL
  [Implicit @scope in construted stylesheet]
    expected: FAIL
  [Matching :host via &, :scope (subject)]
    expected: FAIL
  [Matching :host via &, :scope (non-subject)]
    expected: FAIL
  [Matching :host via &, :scope (non-subject, >)]
    expected: FAIL
