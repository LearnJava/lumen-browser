# BUG-474 fixed: `document.caretRangeFromPoint` (CSSOM View §7) now exists
# and returns a Range instance, so the two subtests that only needed the
# function to exist ("no supplied coordinates" and the shadow-vs-
# caretPositionFromPoint comparison, which both stubs resolve to body
# offset 0) now PASS. The remaining FAILs need real layout hit-testing
# (viewport bounds, per-element/per-character resolution), which neither
# caretRangeFromPoint nor caretPositionFromPoint has (Phase 0 stub, see
# `caretPositionFromPoint`'s own comment in web_api_shim_mid.js) -- not a
# regression, a pre-existing engine gap this fix did not touch.
[caretRangeFromPoint.tentative.html]
  [document.caretRangeFromPoint() should return null for a document with no viewport]
    expected: FAIL

  [document.caretRangeFromPoint() should return null if given coordinates outside of the viewport]
    expected: FAIL

  [document.caretRangeFromPoint() should return a Range at the specified location]
    expected: FAIL

  [document.caretRangeFromPoint() should return a client rect close to the given coords]
    expected: FAIL

  [document.caretRangeFromPoint() on a canvas should return a Range pointing at canvas]
    expected: FAIL

  [document.caretRangeFromPoint() on an input should return a Range pointing at input with offset 0]
    expected: FAIL
