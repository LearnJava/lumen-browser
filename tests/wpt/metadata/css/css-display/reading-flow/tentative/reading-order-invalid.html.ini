# Known engine gap, tracked as BUG-484: the inline element.style setter never
# runs the assigned value through the real CSS parser -- invalid values are
# accepted instead of rejected, and valid multi-token/shorthand values are
# not canonicalized on serialization.
# Observed end to end by wptrunner (WPT-RUN-3 sl.7, css/css-display mass run).
# Re-run and flip to PASS once BUG-484 lands.

