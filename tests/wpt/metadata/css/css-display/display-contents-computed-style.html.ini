# return nothing for any inline-level element (span, a, em, ...) -- inline
# content is grouped into anonymous InlineRun/InlineBlockRow boxes keyed by
# the containing block's own NodeId, so an inline element's own NodeId never
# appears in the collect_computed_styles/collect_layout_rects maps.
# Observed end to end by wptrunner (WPT-RUN-3 sl.7, css/css-display mass run).
