# Known engine gap, tracked as BUG-534 (remaining scope): `Highlight`/
# `HighlightRegistry` are now real Setlike/Maplike interfaces and
# `highlightsFromPoint()` exists with full argument validation (StaticRange
# from BUG-533 lands too), but real hit-testing against painted highlight
# ranges is not implemented -- paint never consumes `CSS.highlights` at all
# (`highlight_name` on `DisplayCommand::DrawText` is a Phase-0 stub), so a
# validated call always resolves to zero hits. The two subtests below that
# only assert an empty result (point outside the document; a
# highlight whose only range is collapsed) pass on that basis already and
# were dropped from this file. The `display:none iframe` subtest is left as
# FAIL rather than guessed at -- it also depends on BUG-480's
# `iframe.contentWindow` gap and was not re-verified live.

[HighlightRegistry-highlightsFromPoint.html]
  [CSS.highlights.highlightsFromPoint() returns the Highlights with their corresponding ranges present at the given point in the right order.]
    expected: FAIL
  [CSS.highlights.highlightsFromPoint() returns empty array when called on a display:none iframe document.]
    expected: FAIL
  [CSS.highlights.highlightsFromPoint() returns empty array for coordinates outside the viewport.]
    expected: FAIL
  [CSS.highlights.highlightsFromPoint() skips invalid StaticRanges.]
    expected: FAIL
  [CSS.highlights.highlightsFromPoint() returns all overlapping ranges within the same highlight.]
    expected: FAIL
