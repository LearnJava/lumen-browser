# Known engine gaps, tracked as BUG-391 and BUG-485: (1) BUG-391 --
# querySelector()/matches() never throw SyntaxError for a pseudo-element
# used in a structurally/argument-wise invalid way (e.g. ::highlight with
# no argument, ::highlight(foo) followed by another selector fragment) --
# they fall back to "no match" instead. (2) BUG-485 -- document.head is
# entirely missing; the shared test_valid_selector/test_invalid_selector
# helper (css/support/parsing-testcommon.js) does
# document.head.append(style) as its first step. Observed via the
# structured wptreport (WPT-RUN-3 sl.26, css/css-highlight-api mass run).
# Re-run and flip to PASS once both bugs land.

[highlight-pseudo-parsing.html]
  ["::highlight(foo)" should be a valid selector]
    expected: FAIL
  [".a::highlight(foo)" should be a valid selector]
    expected: FAIL
  ["div ::highlight(foo)" should be a valid selector]
    expected: FAIL
  ["::part(my-part)::highlight(foo)" should be a valid selector]
    expected: FAIL
  ["::highlight(multi\\\\ word)" should be a valid selector]
    expected: FAIL
  ["::highlight(\\\\31\\\\32\\\\33)" should be a valid selector]
    expected: FAIL
  ["::highlight" should be an invalid selector]
    expected: FAIL
  ["::before::highlight(foo)" should be an invalid selector]
    expected: FAIL
  ["::highlight(foo).a" should be an invalid selector]
    expected: FAIL
  ["::highlight(foo) div" should be an invalid selector]
    expected: FAIL
  ["::highlight(foo)::after" should be an invalid selector]
    expected: FAIL
  ["::highlight(foo):hover" should be an invalid selector]
    expected: FAIL
  [":not(::highlight(foo))" should be an invalid selector]
    expected: FAIL
