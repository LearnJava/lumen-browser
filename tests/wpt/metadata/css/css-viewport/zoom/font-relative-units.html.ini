# Known engine gap, tracked as BUG-532: several font-relative units resolve
# to the wrong used value under `zoom` -- `lh`/`ex`/`cap`/`ch` (and `em`
# against the root font-size) don't match their `r*` (root-relative)
# counterpart's rendered width at the same effective zoom, though `ic`/`ric`
# do. Unrelated to the `getComputedStyle()` un-zoom fix (this test measures
# `getBoundingClientRect()`, a used value, not a computed one).

[font-relative-units.html]
  [em = rem]
    expected: FAIL
  [lh = rlh]
    expected: FAIL
  [ex = rex]
    expected: FAIL
  [cap = rcap]
    expected: FAIL
  [ch = rch]
    expected: FAIL
