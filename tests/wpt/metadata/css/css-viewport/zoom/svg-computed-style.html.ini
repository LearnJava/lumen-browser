# Known engine gap, tracked as BUG-532: getComputedStyle() on SVG elements
# for several properties -- some shorthand-only exposure (margin/padding/
# inset/border-width shorthands are not in computed_style_to_map, only their
# longhands), some genuinely unimplemented computed-style properties
# (scroll-margin/scroll-padding/text-decoration-thickness/
# text-underline-offset/-webkit-text-stroke-width), some serialization-order
# mismatches (box-shadow/text-shadow put the color last instead of first),
# and some zoom-scaled used-value width/height/min-*/max-* on SVG elements
# that this WPT test expects un-zoomed (unlike computed-initial.html's
# used-value exclusion for the same properties on HTML elements) -- not
# reached by the getComputedStyle() un-zoom fix. Unrelated to each other;
# re-triage into separate BUG-NNN cards before fixing any of it.

