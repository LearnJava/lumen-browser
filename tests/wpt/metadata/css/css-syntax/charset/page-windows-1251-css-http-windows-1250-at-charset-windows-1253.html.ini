# BUG-509 fixed the "determine the fallback encoding" precedence algorithm
# (BOM > HTTP Content-Type charset > leading @charset > <link charset> >
# referring document > UTF-8), correctly making HTTP win over @charset. But
# the HTTP charset here is windows-1250 -- lumen-encoding does not carry
# that table (deliberate scope per docs/plan/tech-stack.md section 5 /
# subsystems/encoding.md, not a Phase-0 stub), so this tier is skipped and
# the algorithm falls through past @charset windows-1253 (also
# unsupported) to windows-1251 (this page's own encoding), hiding the
# wrong element. Residual, not re-broken by anything else.
