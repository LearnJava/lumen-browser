# Known engine gap, tracked as BUG-499: getComputedStyle().getPropertyValue()
# never serialises custom properties (--name) into the computed-style map --
# computed_style_to_map only walks ~68 well-known typed ComputedStyle fields
# and never iterates ComputedStyle::custom_props, so any "--..." query
# returns "" unconditionally, independent of cache freshness (contrast
# BUG-493).
#
# Observed via the structured wptreport (WPT-RUN-3 sl.18, css/css-syntax
# mass run). Re-run and flip to PASS once BUG-499 lands.

