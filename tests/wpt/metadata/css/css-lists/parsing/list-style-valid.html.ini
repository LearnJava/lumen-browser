# Known engine gap, tracked as BUG-484: the inline style setter
# (CSSStyleDeclaration property setter) does not validate values against
# the property's grammar at all -- any string is accepted verbatim, and
# valid values are not re-serialized into canonical form. Observed via the
# structured wptreport (WPT-RUN-3 sl.28, css/css-lists mass run). Re-run and
# flip to PASS once BUG-484 lands.

[list-style-valid.html]
  [e.style\['list-style'\] = "disc outside none" should set the property value]
    expected: FAIL
  [e.style\['list-style'\] = "inside disc" should set the property value]
    expected: FAIL
  [e.style\['list-style'\] = "inside none none" should set the property value]
    expected: FAIL
  [e.style\['list-style'\] = "none inside none" should set the property value]
    expected: FAIL
  [e.style\['list-style'\] = "none none inside" should set the property value]
    expected: FAIL
  [e.style\['list-style'\] = "none inside" should set the property value]
    expected: FAIL
  [e.style\['list-style'\] = "none url(\\"https://example.com/\\")" should set the property value]
    expected: FAIL
  [e.style\['list-style'\] = "url(\\"https://example.com/\\") disc" should set the property value]
    expected: FAIL
  [e.style\['list-style'\] = "url(\\"https://example.com/\\") disc outside" should set the property value]
    expected: FAIL
  [e.style\['list-style'\] = "square url(\\"https://example.com/\\") inside" should set the property value]
    expected: FAIL
  [e.style\['list-style'\] = "square linear-gradient(red,blue) inside" should set the property value]
    expected: FAIL
  [e.style\['list-style'\] = "disc radial-gradient(circle, #006, #00a 90%, #0000af 100%,white 100%) inside" should set the property value]
    expected: FAIL
