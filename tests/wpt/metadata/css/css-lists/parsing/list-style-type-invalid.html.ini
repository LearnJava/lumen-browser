# Known engine gap, tracked as BUG-484: the inline style setter
# (CSSStyleDeclaration property setter) does not validate values against
# the property's grammar at all -- any string is accepted verbatim, and
# valid values are not re-serialized into canonical form. Observed via the
# structured wptreport (WPT-RUN-3 sl.28, css/css-lists mass run). Re-run and
# flip to PASS once BUG-484 lands.

[list-style-type-invalid.html]
  [e.style\['list-style-type'\] = "\\"marker string\\" none" should not set the property value]
    expected: FAIL
  [e.style\['list-style-type'\] = "counter-Style-Name \\"marker string\\"" should not set the property value]
    expected: FAIL
  [e.style\['list-style-type'\] = "symbols(cyclic)" should not set the property value]
    expected: FAIL
  [e.style\['list-style-type'\] = "symbols(numeric \\"n\\")" should not set the property value]
    expected: FAIL
  [e.style\['list-style-type'\] = "symbols(alphabetic \\"a\\")" should not set the property value]
    expected: FAIL
  [e.style\['list-style-type'\] = "symbols(\\"s\\" symbolic)" should not set the property value]
    expected: FAIL
  [e.style\['list-style-type'\] = "symbols(fixed url(\\"https://example.com\\"))" should not set the property value]
    expected: FAIL
  [e.style\['list-style-type'\] = "symbols(repeating '○' '●')" should not set the property value]
    expected: FAIL
