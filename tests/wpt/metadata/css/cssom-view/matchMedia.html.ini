# Genuine engine gap, tracked as BUG-480: `<iframe>` has no separate browsing
# context -- `contentWindow`/`contentDocument` are absent from the JS shim
# entirely, so anything that reaches into a sub-document (media-query
# listeners driven by iframe resize, subframe scroll-behavior, hit-testing
# across iframes) hangs or throws. Observed end to end by wptrunner
# (WPT-RUN-3 sl.4, css/cssom-view mass run). Re-run and flip to PASS once
# BUG-480 lands.

[matchMedia.html]
  expected: TIMEOUT
  [window.matchMedia("(min-width: 1px)") matches]
    expected: FAIL
  [media query with syntax error is serialized as "not all"]
    expected: FAIL
  [iframe.matchMedia("(max-width: 199px), all and (min-width: 200px)") is serialized w/o "all"]
    expected: TIMEOUT
  [iframe.matchMedia("(min-aspect-ratio: 1/1)") matches]
    expected: NOTRUN
  [iframe.matchMedia("(width: 200px)") matches]
    expected: NOTRUN
  [iframe.matchMedia("(max-height: 50px)") matches]
    expected: NOTRUN
  [iframe.matchMedia("(min-width: 150px)") matches]
    expected: NOTRUN
