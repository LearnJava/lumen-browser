# Genuine engine gap, tracked as BUG-479: the `Element`/`Window` scroll API is
# a narrow x/y-only stub -- no `scroll()` alias (only `scrollTo`/`scrollBy`/
# `scrollIntoView`), `scrollIntoView` ignores its options argument entirely,
# none of the three methods returns a `Promise`. Observed end to end by
# wptrunner (WPT-RUN-3 sl.4, css/cssom-view mass run). Re-run and flip to
# PASS once BUG-479 lands.

