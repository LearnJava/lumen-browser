# Genuine engine gap, tracked as BUG-480: `<iframe>` has no separate browsing
# context -- `contentWindow`/`contentDocument` are absent from the JS shim
# entirely, so anything that reaches into a sub-document (media-query
# listeners driven by iframe resize, subframe scroll-behavior, hit-testing
# across iframes) hangs or throws. Observed end to end by wptrunner
# (WPT-RUN-3 sl.4, css/cssom-view mass run). Re-run and flip to PASS once
# BUG-480 lands.

