# Genuine engine gap, tracked as BUG-475: `scrollWidth`/`scrollHeight`/
# `scrollTop`/`scrollLeft` are 0 on any element that isn't `overflow:
# scroll`/`auto` -- `collect_scroll_containers` (layout/src/lib.rs:1121) only
# tracks boxes with that overflow value, but CSSOM View defines these
# properties for every element. Observed end to end by wptrunner (WPT-RUN-3
# sl.4, css/cssom-view mass run). Re-run and flip to PASS once BUG-475 lands.

