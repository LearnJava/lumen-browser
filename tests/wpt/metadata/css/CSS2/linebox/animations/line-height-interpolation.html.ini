# Genuine engine gap, tracked as BUG-463: `'animate' in Element.prototype` is
# false (WAAPI `animate`/`getAnimations` are attached as own properties on
# each element instance in `_lumen_build_element`, dom.rs:6603-6608, instead
# of on `Element.prototype` like the rest of the shim) —
# `css/support/interpolation-testcommon.js`'s `Web Animations` feature-detect
# reports unsupported even though `element.animate()` itself works. Observed
# end to end by wptrunner (WPT-RUN-3 sl.2, css/CSS2 mass run). Re-run and flip
# to PASS once BUG-463 lands.
