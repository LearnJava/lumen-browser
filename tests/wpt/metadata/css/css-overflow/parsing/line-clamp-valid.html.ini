# Known engine gap, tracked as BUG-505: CSS Overflow L3-L5 features are
# essentially unimplemented -- text-overflow, line-clamp/-webkit-line-clamp/
# max-lines, block-ellipsis/continue, overflow-clip-margin edge cases,
# scroll-axis-lock, scrollbar-gutter (layout effect + invalid-value
# rejection), the legacy -webkit-box display value, and the
# ::scroll-marker/::scroll-marker-group/::scroll-button()/scroll-target-group
# pseudo-elements and their supporting properties are all missing or only
# superficially parsed (invalid values pass through unrejected).
#
# Observed via the structured wptreport (WPT-RUN-3 sl.11, css/css-overflow
# mass run). Re-run and flip to PASS once BUG-505 lands.

[line-clamp-valid.html]
  [e.style\['line-clamp'\] = "ellipsis" should set the property value]
    expected: FAIL
  [e.style\['line-clamp'\] = "8 ellipsis" should set the property value]
    expected: FAIL
  [e.style\['line-clamp'\] = "no-ellipsis 10" should set the property value]
    expected: FAIL
  [e.style\['line-clamp'\] = "auto 11" should set the property value]
    expected: FAIL
  [e.style\['line-clamp'\] = "ellipsis 11" should set the property value]
    expected: FAIL
  [e.style\['line-clamp'\] = "\\" etc., etc. \\" 12" should set the property value]
    expected: FAIL
