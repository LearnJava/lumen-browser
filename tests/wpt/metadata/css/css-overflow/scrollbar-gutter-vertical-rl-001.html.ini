# Known engine gap, tracked as BUG-504. BUG-504 (P3, 2026-09-03, part 5)
# root-caused and fixed the vertical-writing-mode component: the block axis
# is physically horizontal under `writing-mode: vertical-rl`, so it is
# `overflow-x` (not `overflow-y`) that must trigger the gutter reservation,
# and the dimension reserved is physical height (the inline dimension), not
# width. See scrollbar_gutter_block/_block_start (box_tree/predicates.rs)
# and vertical.rs::lay_out_vertical_block.
#
# One subtest remains a known DEBTOR (not this bug's gap): Lumen's overlay
# scrollbars never reserve layout space for `scrollbar-gutter: auto`
# regardless of `overflow: scroll`'s persistent scrollbar — same
# architectural gap already carried by scrollbar-gutter-001.html (LTR) and
# scrollbar-gutter-rtl-001.html.

[scrollbar-gutter-vertical-rl-001.html]
  [overflow scroll, scrollbar-gutter auto]
    expected: FAIL
