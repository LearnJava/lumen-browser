# Known engine gap, tracked as BUG-504: content_width()/content_height()
# (crates/engine/layout/src/lib.rs) compute scrollWidth/scrollHeight purely
# from each child's post-layout `rect`, which never reflects a CSS
# `transform` (verified by source read) and is also wrong in several other
# css-overflow scenarios (abspos, clip-margin, RTL/logical axes) not yet
# individually root-caused.
