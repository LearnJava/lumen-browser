# BUG-504 (scrollbar-gutter RTL slice): `scrollbar_gutter_inline_start`
# (crates/engine/layout/src/box_tree/predicates.rs) bailed out to `0.0` for
# any `direction: rtl` container, so a single-edge `stable` gutter (which
# sits on the physical *left* under RTL, since inline-end is physically left
# there) never shifted the content box's start edge — only the LTR case
# (physical right, no shift needed) worked. Fixed: RTL `stable` now shifts by
# the full unit, `stable both-edges` by one unit symmetrically (direction-
# independent, as already tested for LTR). The one remaining failure below
# is unrelated to direction — it is the same overlay-scrollbar architecture
# DEBTOR already tracked for the LTR file (`scrollbar-gutter-001.html`):
# `scrollbar-gutter: auto` never reserves layout space regardless of
# `overflow-y: scroll`'s persistent scrollbar, so `content.offsetWidth ==
# container.offsetWidth` by design, whereas the WPT assertion assumes a
# classic (space-consuming) OS scrollbar.

