# BUG-504 (P3 slice 2026-09-03): root-caused as two independent
# `scrollbar_gutter_inline`/`scrollbar_gutter_block` defects, both fixed —
# `overflow-y/-x: hidden` now reserves the `stable` gutter same as
# `scroll`/`auto` (CSS Overflow L3 §3.3, hidden still establishes a scroll
# container), and `stable both-edges` now shifts the content box's start
# edge, not just narrows it. 6 of the 7 originally-failing subtests pass.
#
# The one remaining failure is NOT this bug's scrollable-overflow gap —
# it is Lumen's overlay-scrollbar architecture (`scrollbar_gutter_inline`'s
# doc comment): `overflow-y: scroll` with `scrollbar-gutter: auto` renders a
# scrollbar that never consumes layout space, so `content.offsetWidth`
# equals `container.offsetWidth` here by design, whereas this WPT assertion
# assumes a classic (space-consuming) OS scrollbar. Reversing that would
# require abandoning overlay scrollbars project-wide — out of scope for a
# single bug fix. KNOWN_DEBTOR, not re-triaged as its own bug.

