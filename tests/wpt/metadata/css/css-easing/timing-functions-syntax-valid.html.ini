# Known engine gap, tracked as BUG-484: the inline `element.style` setter
# (_lumen_make_style, crates/js/src/dom.rs:4264-4302) never routes the
# value through css-parser's real <easing-function> grammar -- invalid
# values (bad arity, out-of-range cubic-bezier control points, invalid
# steps() argument combinations, malformed linear()) are stored verbatim
# instead of being rejected, and valid-but-non-canonical values (extra
# whitespace, un-simplified calc(), the step-start/step-end/steps(N, end)
# keyword aliases) are never re-serialized into their canonical form.
#
# Observed via the structured wptreport (WPT-RUN-3 sl.15, css/css-easing
# mass run). Re-run and flip to PASS once BUG-484 lands.


