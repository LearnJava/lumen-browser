# Known engine gap, tracked as BUG-493: no DOM geometry/style accessor in
# this engine forces a synchronous layout/style flush before reading --
# offsetWidth / getComputedStyle() resolve against whatever snapshot was
# last externally pushed, which for a value mutated (via animation-delay,
# WAAPI Animation.currentTime, or simply during the page's own initial
# synchronous <script>) in the SAME script tick is stale or entirely
# absent (empty string / 0), not the real, already-computed value.
# Confirmed live via a minimal, animation-free --mcp-port repro
# (offsetWidth read synchronously during initial parse -> 0, the same
# read via a later, separate eval() call -> the real value).
#
# Observed via the structured wptreport (WPT-RUN-3 sl.15, css/css-easing
# mass run). Re-run and flip to PASS once BUG-493 lands.


