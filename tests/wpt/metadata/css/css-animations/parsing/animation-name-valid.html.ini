    expected: FAIL
  [e.style\['animation-name'\] = "\\"something\\"" should set the property value]
    expected: FAIL
  [e.style\['animation-name'\] = "\\"---\\\\22---\\"" should set the property value]
    expected: FAIL
  [e.style\['animation-name'\] = "\\"multi word string\\"" should set the property value]
    expected: FAIL
