# Genuine engine gap, tracked as BUG-483: `window.getComputedStyle()` returns
# a `Proxy` with no `has` trap, so `property in getComputedStyle(el)` is
# unconditionally `false` for every property -- the first assertion in
# `computed-testcommon.js`'s `test_computed_value()` helper, so these tests
# never reach the actual value comparison. Observed end to end by wptrunner
# (WPT-RUN-3 sl.5, css/css-box mass run). Re-run and flip to PASS once
# BUG-483 lands (some subtests may then surface a second, different gap --
# re-triage rather than assume a clean pass).


