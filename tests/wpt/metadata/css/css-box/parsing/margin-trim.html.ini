# Genuine engine gap, tracked as BUG-484: the inline `element.style` setter
# (`_lumen_make_style`) never routes values through the real CSS parser --
# invalid values are stored verbatim instead of rejected, shorthand
# properties (`margin`/`padding`) are not expanded into longhands, and
# multi-token/`calc()` values are not re-serialized into canonical form.
