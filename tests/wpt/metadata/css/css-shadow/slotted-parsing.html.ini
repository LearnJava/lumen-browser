# Known engine gap, tracked as BUG-391: matches()/querySelector(All)/
# closest() never throw SyntaxError/DOMException on a structurally
# invalid selector (unknown token OR a known pseudo-class/element used
# with invalid arguments) -- silent no-op instead.
# Observed via the structured wptreport (WPT-RUN-3 sl.29).
# Re-run and flip to PASS once BUG-391 lands.

# Known engine gap, tracked as BUG-485: document.head is undefined -- no
