# Known engine gap, tracked as BUG-484: the inline style setter
# (CSSStyleDeclaration property setter) does not validate values against
# the property's grammar at all -- any string is accepted verbatim, and
# valid values are not re-serialized into canonical form. Observed via the
# structured wptreport (WPT-RUN-3 sl.28, css/css-inline mass run). Re-run and
# flip to PASS once BUG-484 lands.

[initial-letter-invalid.html]
  [e.style\['initial-letter'\] = "foobar" should not set the property value]
    expected: FAIL
  [e.style\['initial-letter'\] = "drop" should not set the property value]
    expected: FAIL
