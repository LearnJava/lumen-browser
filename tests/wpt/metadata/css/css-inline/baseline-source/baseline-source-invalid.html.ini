    expected: FAIL
  [e.style\['baseline-source'\] = "auto first" should not set the property value]
    expected: FAIL
  [e.style\['baseline-source'\] = "first auto" should not set the property value]
    expected: FAIL
  [e.style\['baseline-source'\] = "3px" should not set the property value]
