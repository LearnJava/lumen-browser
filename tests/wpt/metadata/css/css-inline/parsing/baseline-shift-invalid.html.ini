    expected: FAIL
  [e.style\['baseline-shift'\] = "-10px 20%" should not set the property value]
    expected: FAIL
  [e.style\['baseline-shift'\] = "calc(2em + 3ex), 0" should not set the property value]
    expected: FAIL
  [e.style\['baseline-shift'\] = "sub super" should not set the property value]
    expected: FAIL
  [e.style\['baseline-shift'\] = "20px sub" should not set the property value]
    expected: FAIL
