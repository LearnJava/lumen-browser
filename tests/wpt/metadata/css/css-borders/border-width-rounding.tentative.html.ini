# Two independent known engine gaps in this file:
# - border-width: ... subtests -- BUG-472: getComputedStyle() resolves
#   through a fixed ~64-key map (computed_style_to_map); border-width
#   is a shorthand alias, not itself a key, so it's silently empty.
# - outline-width: ... subtests -- BUG-493: getComputedStyle() reads a
#   cached snapshot (update_computed_styles) that is not refreshed
#   synchronously before the read, so a node created+styled+appended
#   earlier in the SAME script turn has no entry at all yet (empty
#   rather than merely stale).
# Observed via the structured wptreport (WPT-RUN-3 sl.8, css/css-borders
# mass run).
# Re-run and flip to PASS once BUG-472 and BUG-493 land.

