# Known engine gap, tracked as BUG-491: CSS Borders and Box Decorations
# Level 4 draft properties (corner-shape family, border-shape, the
# box-shadow-{offset,color,blur,spread,position} standalone longhands,
# the border-*-radius pair shorthands, border-clip, the hairline keyword)
# are entirely unimplemented -- apply_declaration's catch-all `_ => {}`
# silently drops the declaration, computed_style_to_map has no key for it.
# Observed via the structured wptreport (WPT-RUN-3 sl.8, css/css-borders
# mass run).
# Re-run and flip to PASS once BUG-491 lands.
#
# Also affected by already-open BUG-463: WAAPI `animate` is not installed
# on Element.prototype, so interpolation-testcommon.js's
# 'Web Animations should be supported' assertion fails independently of
# the property itself.

