# Known engine gap, tracked as BUG-484: the inline style setter
# (_lumen_make_style, crates/js/src/dom.rs:4264) never routes through the
# real CSS parser -- it stores and echoes back the raw string
# unconditionally, for any property, so invalid values are never rejected
# and valid values are never canonicalized/decomposed into longhands.
# Observed via the structured wptreport (WPT-RUN-3 sl.8, css/css-borders
# mass run).
# Re-run and flip to PASS once BUG-484 lands.

