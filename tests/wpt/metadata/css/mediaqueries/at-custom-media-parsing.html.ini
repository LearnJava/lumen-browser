# Known engine gap, tracked as BUG-471: the CSSOM stylesheet/rule object
# model (CSSStyleSheet/CSSRule/...) is not implemented.
# Observed via WPT-RUN-3 slice 24 (css-mediaqueries mass run).

[at-custom-media-parsing.html]
  [@custom-media --query (max-width: 30em) is valid]
    expected: FAIL
  [@custom-media --query (color), (hover) is valid]
    expected: FAIL
  [@custom-media --query not all and (hover: hover) is valid]
    expected: FAIL
  [@custom-media --query true is valid]
    expected: FAIL
  [@custom-media --query false is valid]
    expected: FAIL
  [@custom-media -- true is valid]
    expected: FAIL
  [@custom-media --foo/* */(width > 42px) is valid]
    expected: FAIL
  [@custom-media query () is invalid]
    expected: FAIL
  [@custom-media query (max-width: 30em) is invalid]
    expected: FAIL
  [@custom-media --query(max-width: 30em) is invalid]
    expected: FAIL
  [@custom-media --query(max-width: 30em) ! is invalid]
    expected: FAIL
  [@custom-media -query(max-width: 30em) is invalid]
    expected: FAIL
  [@custom-media --query true! is invalid]
    expected: FAIL
  [@custom-media --query false true is invalid]
    expected: FAIL
