# Known engine gap, tracked as BUG-384: named access on Window (bare-id) is
# not implemented -- a bare identifier referencing an element by its id
# throws ReferenceError instead of resolving. The cleanup handler for the
# first ("contenteditable") case also references a bare id and fails, which
# turns the file-level status ERROR and NOTRUNs the remaining two
# parameterized cases (textarea / input) before they get a chance to run.
# Observed via WPT-RUN-3 slice 24 (css-scroll-anchoring mass run).

[scroll-anchoring-editing-content-change.html]
  expected: ERROR

  [contenteditable: scroll anchoring preserves anchor position after typing and content removal above]
    expected: FAIL

  [textarea: scroll anchoring preserves anchor position after typing and content removal above]
    expected: NOTRUN

  [input: scroll anchoring preserves anchor position after typing and content removal above]
    expected: NOTRUN
