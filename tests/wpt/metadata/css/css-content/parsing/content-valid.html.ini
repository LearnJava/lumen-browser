# Known engine gap, tracked as BUG-484: the inline style setter doesn't
# validate/canonicalize values -- invalid values are stored verbatim
# instead of being rejected, and valid-but-noncanonical values (case of
# a <counter-style> keyword) aren't normalized on serialization.
# Observed via WPT-RUN-3 slice 24 (css-content mass run).

[content-valid.html]
  [e.style['content'\] = "counter(counter-name, dECiMaL)" should set the property value]
    expected: FAIL
  [e.style['content'\] = "counter(counter-name, dECiMaL) / \\"alt text\\"" should set the property value]
    expected: FAIL
  [e.style['content'\] = "counter(counter-name, DECIMAL)" should set the property value]
    expected: FAIL
  [e.style['content'\] = "counter(counter-name, DECIMAL) / \\"alt text\\"" should set the property value]
    expected: FAIL
  [e.style['content'\] = "counters(counter-name, \\".\\", dECiMaL)" should set the property value]
    expected: FAIL
  [e.style['content'\] = "counters(counter-name, \\".\\", dECiMaL) / \\"alt text\\"" should set the property value]
    expected: FAIL
  [e.style['content'\] = "counters(counter-name, \\".\\", DECIMAL)" should set the property value]
    expected: FAIL
  [e.style['content'\] = "counters(counter-name, \\".\\", DECIMAL) / \\"alt text\\"" should set the property value]
    expected: FAIL
