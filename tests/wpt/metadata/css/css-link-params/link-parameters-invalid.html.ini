  [e.style['link-parameters'\] = "param(-a, )" should not set the property value]
    expected: FAIL
  [e.style['link-parameters'\] = "param(-a, blue)" should not set the property value]
    expected: FAIL
  [e.style['link-parameters'\] = "param--a)" should not set the property value]
    expected: FAIL
  [e.style['link-parameters'\] = "para(--a)" should not set the property value]
    expected: FAIL
  [e.style['link-parameters'\] = "param(--a red)" should not set the property value]
    expected: FAIL
  [e.style['link-parameters'\] = "param(--a)" should not set the property value]
    expected: FAIL
  [e.style['link-parameters'\] = "param(--a), param(--b)" should not set the property value]
