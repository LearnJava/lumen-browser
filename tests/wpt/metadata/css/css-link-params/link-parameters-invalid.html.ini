# Known engine gap, tracked as BUG-484: the inline `style` setter never
# validates values -- malformed `param(...)` syntax is accepted verbatim
# instead of being rejected.
# Observed via the structured wptreport (WPT-RUN-3 sl.21, css/css-link-
# params + css-forced-color-adjust + css-size-adjust + css-device-adapt +
# css-env + css-overscroll-behavior mass run). Re-run and flip to PASS
# once the bug lands.


[link-parameters-invalid.html]
  [e.style['link-parameters'\] = "non" should not set the property value]
    expected: FAIL
