# Known engine gap, tracked as BUG-484: the inline style setter
# (CSSStyleDeclaration property setter) does not validate values against
# the property's grammar at all -- any string is accepted verbatim, and
# valid values are not re-serialized into canonical form. Observed via the
# structured wptreport (WPT-RUN-3 sl.28, css/css-images mass run). Re-run and
# flip to PASS once BUG-484 lands.

[object-view-box-parsing.html]
  [e.style\['object-view-box'\] = "circle(10px)" should not set the property value]
    expected: FAIL
  [e.style\['object-view-box'\] = "ellipse(10px 20px)" should not set the property value]
    expected: FAIL
  [e.style\['object-view-box'\] = "polygon(10px 20px 30px)" should not set the property value]
    expected: FAIL
  [e.style\['object-view-box'\] = "path(\\"M20,80 L50,20\\")" should not set the property value]
    expected: FAIL
  [e.style\['object-view-box'\] = "blah" should not set the property value]
    expected: FAIL
  [e.style\['object-view-box'\] = "xywh(1px 10%)" should not set the property value]
    expected: FAIL
