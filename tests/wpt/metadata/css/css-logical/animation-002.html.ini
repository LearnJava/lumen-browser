# Known engine gap, tracked as BUG-506: under the actual wptrunner/BiDi
# test-execution pipeline, this file's external helper script
# (`../css-animations/support/testcommon.js`, which defines `addDiv`/
# `addStyle`) never runs before the page's own inline <script> calls
# `addDiv(t)`/`addStyle(t, ...)` -- every test() body throws
# `ReferenceError: addDiv is not defined` (or `addStyle`). A manual
# `--mcp-live-port` probe of the same URL, querying `typeof
# window.addDiv` in a SEPARATE eval() call after navigate() returns,
# shows the function correctly defined -- so this is not a case of the
# helper genuinely never loading, but a race/ordering defect specific to
# the actual wptrunner-driven page-load-and-run sequence (mechanism not
# fully isolated this slice; see BUG-506 for the full writeup).
