# Known engine gap, tracked as BUG-506, re-attributed 2026-09-04 to
# CSSOM-4/BUG-493 (see bugs/BUG-506-OPEN.md's 2026-09-04 slice for the
# full investigation). The ORIGINAL symptom this .ini was written against
# (a cross-directory external <script src> never running before
# dependent inline code, ReferenceError: addDiv is not defined) no
# longer reproduces -- re-measured against the real wptrunner
# (`--bidi-port`, `LumenTestharnessExecutor`, unmodified) pipeline and
# `addDiv`/`addStyle` are correctly defined every run. Every subtest
# below still fails, now because of a different, already-tracked cause:
# `FlushHandles::maybe_flush` (crates/js/src/v8_runtime/style_flush.rs)
# is a no-op outside `InProcessSession` (headless/--mcp-port), so the
# live `--bidi-port` shell every real WPT run uses never flushes style/
# layout synchronously before a same-turn JS read -- `addDiv(t)` inserts
# a fresh <div>, and the immediately-following `getComputedStyle(div)`
# reads back "" for every property (no `computed_styles` entry yet for
# that node), not the value BUG-506's original filing expected instead
# (a ReferenceError). See bugs/BUG-493-OPEN.md/BUG-977-OPEN.md/CSSOM-4
# and CSSOM-7 in ROADMAP.md. Re-run and flip once CSSOM-4's live-shell
# coverage follow-up lands.
#
# `[Logical properties are NOT stored as physical properties]` does not
# call `getComputedStyle` (only inspects `KeyframeEffect.getKeyframes()`
# structure) -- it does not hit this gap and genuinely PASSes, so it was
# removed from the FAIL list below (2026-09-04).


