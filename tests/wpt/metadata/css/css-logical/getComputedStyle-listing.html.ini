# Known engine gap, tracked as BUG-472: `getComputedStyle()` resolved-value
# coverage gaps -- `computed_style_to_map` (selector_query.rs) is a
# hand-written ~64-entry map. This slice's largest single extension of the
# bug: confirmed by direct source read that NONE of the CSS Logical
# Properties longhands/shorthands are in the map at all (zero hits for
# block-size/inline-size/inset-block-*/inset-inline-*/margin-block-*/
# margin-inline-*/padding-block-*/padding-inline-*/border-block-*/
# border-inline-*/max-*/min-* logical names in selector_query.rs), even
# though the physical properties they resolve to (width/height/margin-
# top/.../border-top-color/...) are themselves in the map and render
# correctly. Any getComputedStyle() query for a logical property name
# silently returns "" instead of the resolved value.
#
# Observed via the structured wptreport (WPT-RUN-3 sl.12, css/css-logical
# mass run). Re-run and flip to PASS once BUG-472 lands.


