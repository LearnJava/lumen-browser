# Known engine gap, tracked as BUG-493: `getComputedStyle()`/`offsetWidth`/
# `clientWidth` read a snapshot cache (`computed_styles`/`layout_rects`)
# that is populated only after `navigate()` returns -- never synchronously
# in response to a page's own top-level <script> running during initial
# parse, or right after a same-tick style mutation. This file's script
# reads geometry/computed-style values in exactly that pattern, so every
# read comes back empty/zero instead of the real, already-correct layout
# result.
#
# Observed via the structured wptreport (WPT-RUN-3 sl.12, css/css-logical
# mass run). Re-run and flip to PASS once BUG-493 lands.


