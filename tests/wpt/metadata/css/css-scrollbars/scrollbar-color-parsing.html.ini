# Known engine gap, tracked as BUG-484: the inline style setter doesn't
# validate/canonicalize values -- invalid values are stored verbatim
# instead of being rejected, and valid-but-noncanonical color values
# (hex) aren't serialized to the canonical rgb() form.
# Observed via WPT-RUN-3 slice 24 (css-scrollbars mass run).

[scrollbar-color-parsing.html]
  [e.style['scrollbar-color'\] = "#FF0000 #00FF00" should set the property value]
    expected: FAIL
  [e.style['scrollbar-color'\] = "auto auto" should not set the property value]
    expected: FAIL
  [e.style['scrollbar-color'\] = "auto currentcolor" should not set the property value]
    expected: FAIL
  [e.style['scrollbar-color'\] = "red" should not set the property value]
    expected: FAIL
  [e.style['scrollbar-color'\] = "#FF0000" should not set the property value]
    expected: FAIL
