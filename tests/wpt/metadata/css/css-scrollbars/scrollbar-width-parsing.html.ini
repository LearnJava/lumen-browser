# Known engine gap, tracked as BUG-484: the inline style setter doesn't
# validate/canonicalize values -- invalid values are stored verbatim
# instead of being rejected, and valid-but-noncanonical color values
# (hex) aren't serialized to the canonical rgb() form.
# Observed via WPT-RUN-3 slice 24 (css-scrollbars mass run).

[scrollbar-width-parsing.html]
  [e.style['scrollbar-width'\] = "auto none" should not set the property value]
    expected: FAIL
  [e.style['scrollbar-width'\] = "thin auto" should not set the property value]
    expected: FAIL
  [e.style['scrollbar-width'\] = "none thin" should not set the property value]
    expected: FAIL
  [e.style['scrollbar-width'\] = "auto thin none" should not set the property value]
    expected: FAIL
  [e.style['scrollbar-width'\] = "tiny" should not set the property value]
    expected: FAIL
  [e.style['scrollbar-width'\] = "enormous" should not set the property value]
    expected: FAIL
  [e.style['scrollbar-width'\] = "12px" should not set the property value]
    expected: FAIL
  [e.style['scrollbar-width'\] = "3em" should not set the property value]
    expected: FAIL
  [e.style['scrollbar-width'\] = "20%" should not set the property value]
    expected: FAIL
  [e.style['scrollbar-width'\] = "#FF0000" should not set the property value]
    expected: FAIL
  [e.style['scrollbar-width'\] = "red green" should not set the property value]
    expected: FAIL
