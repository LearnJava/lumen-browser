# Known engine gap, tracked as BUG-484 (extended this slice): the inline
# `element.style` model is a flat, literal key-value map with no
# shorthand/longhand interaction -- setting `margin-top` after `margin:
# var(--prop)` never invalidates the `margin` shorthand's serializability (a
# real CSSOM would return "" for `margin` once any of its longhands is set
# independently), so `getPropertyValue('margin')` keeps returning the literal
# `var(--prop)` text instead.
#
# Observed via the structured wptreport (WPT-RUN-3 sl.10, css/css-variables
# mass run). Re-run and flip to PASS once BUG-484 lands.

