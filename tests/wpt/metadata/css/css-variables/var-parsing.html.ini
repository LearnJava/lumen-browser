# Known engine gap, tracked as BUG-484: the inline `element.style` setter
# never validates a value against the property's grammar before storing it --
# an e.style['width'] = 'var(--x ())' (malformed var() argument syntax) is
# accepted and stored verbatim instead of being rejected (left empty).
#
# Observed via the structured wptreport (WPT-RUN-3 sl.10, css/css-variables
# mass run). Re-run and flip to PASS once BUG-484 lands.

[var-parsing.html]
  [e.style['width'\] = "var(--x ())" should not set the property value]
    expected: FAIL
  [e.style['width'\] = "var(--x () )" should not set the property value]
    expected: FAIL
  [e.style['width'\] = "var(--x() )" should not set the property value]
    expected: FAIL
  [e.style['width'\] = "var(--x (),)" should not set the property value]
    expected: FAIL
  [e.style['width'\] = "var(--x(),)" should not set the property value]
    expected: FAIL
