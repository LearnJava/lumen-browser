# Known engine gap, tracked as BUG-501: CSS.supports()'s one-arg form never
# retries wrapped in parens per the CSSOM spec fallback, so the
# unparenthesized `CSS.supports('prop:revert-rule')` guard at the top of
# every test() here returns false and none of the actual getComputedStyle()
# assertions are ever reached. Also see BUG-487 (revert-rule itself has zero
# cascade implementation) -- likely a second, currently-invisible blocker
# once BUG-501 is fixed.
#
# Observed via the structured wptreport (WPT-RUN-3 sl.10, css/css-variables
# mass run). Re-run and flip to PASS once BUG-501 (and possibly BUG-487)
# land.

[revert-rule-in-fallback.html]
  [var(--unknown, revert-rule) in custom property]
    expected: FAIL
  [var(--unknown, revert-rule) in shorthand]
    expected: FAIL
  [var(--unknown, revert-rule) in shorthand observed via longhand]
    expected: FAIL
  [var(--unknown, revert-rule) in longhand]
    expected: FAIL
