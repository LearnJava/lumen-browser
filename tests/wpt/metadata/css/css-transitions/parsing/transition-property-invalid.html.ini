# Known engine gap, tracked as BUG-536: CSS Transitions produce no
# JS-observable effect -- no Animation/CSSTransition object from
# getAnimations(), no transitionrun/transitionstart/transitionend/
# transitioncancel events, and getComputedStyle() never reflects a live
# interpolated value mid-transition. Observed via the structured wptreport
# (WPT-RUN-3 sl.27, css/css-transitions mass run). Re-run and flip to PASS
# once BUG-536 lands.

