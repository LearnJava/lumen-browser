[update-and-send-events.html]
  # BUG-1039: race between finish/cancel event dispatch and the rAF queue.
  # classify_one (expectations.py) only compares against the FIRST listed
  # status, so the non-good one must come first or a flip still reads as
  # a regression regardless of what else is listed.
  [Fires cancel event before requestAnimationFrame]
    expected: [FAIL, PASS]

  [Fires finish event before requestAnimationFrame]
    expected: [FAIL, PASS]

  [Sorts finish events by composite order]
    expected: FAIL

  [Sorts cancel events by composite order]
    expected: FAIL

  [Queues a cancel event in transitionstart event callback]
    expected: FAIL

  [Sorts events for the same transition]
    expected: FAIL

  [Playback events with the same timeline retain the order in which they arequeued]
    expected: FAIL
