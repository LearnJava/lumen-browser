[Create-invalid-urls.any.html]
  [new WebSocket("ws://foo bar.com/") should throw a "SyntaxError" DOMException]
    expected: FAIL

  [new WebSocket("wss://foo bar.com/") should throw a "SyntaxError" DOMException]
    expected: FAIL

  [new WebSocket("ftp://localhost:18300/") should throw a "SyntaxError" DOMException]
    expected: FAIL

  [new WebSocket("mailto:example@example.org") should throw a "SyntaxError" DOMException]
    expected: FAIL

  [new WebSocket("about:blank") should throw a "SyntaxError" DOMException]
    expected: FAIL

  [new WebSocket("http://localhost:18300/#") should throw a "SyntaxError" DOMException]
    expected: FAIL

  [new WebSocket("http://localhost:18300/#test") should throw a "SyntaxError" DOMException]
    expected: FAIL

  [new WebSocket("#test") should throw a "SyntaxError" DOMException]
    expected: FAIL


