[sethtml-safety.html]
  [Testcase #0, setHTML("test").]
    expected: FAIL

  [Testcase #1, setHTML("<p>Hello</p>").]
    expected: FAIL

  [Testcase #2, setHTML("<div>Hello<script>World</script>xxx").]
    expected: FAIL

  [Testcase #3, setHTML("<div>Hello<script>World</script>xxx").]
    expected: FAIL

  [Testcase #4, setHTML("<svg>Hello<script>World</script>xxx").]
    expected: FAIL

  [Testcase #5, setHTML("<a href="https://localhost/" onclick="2+2" one="two">").]
    expected: FAIL

  [Testcase #6, setHTML("<a href="https://localhost/" onclick="2+2" one="two">").]
    expected: FAIL

  [Testcase #7, setHTML("<img src="https://localhost/test-image" onclick="2+2" one="two">").]
    expected: FAIL

  [Testcase #8, setHTML("<p data-x="1" data-y="2" data-z="3">").]
    expected: FAIL

  [Testcase #9, setHTML("<div><base href="https://example.org/"></base></div>").]
    expected: FAIL

  [Testcase #10, setHTML("<div><embed src="https://example.org/"></embed></div>").]
    expected: FAIL

  [Testcase #11, setHTML("<div><iframe src="https://example.org/"></iframe></div>").]
    expected: FAIL

  [Testcase #12, setHTML("<div><object data="https://example.org/"></object></div>").]
    expected: FAIL

  [Testcase #13, setHTML("<div><script src="https://example.org/"></script></div>").]
    expected: FAIL

  [Testcase #14, setHTML("<svg><script src="https://example.org/"></script></svg>").]
    expected: FAIL

  [Testcase #15, setHTML("<svg><use href="https://example.org/"></use></svg>").]
    expected: FAIL

  [Testcase #1, setHTMLUnsafe("<p>Hello</p>").]
    expected: FAIL

  [Testcase #4, setHTMLUnsafe("<svg>Hello<script>World</script>xxx").]
    expected: FAIL

  [Testcase #5, setHTMLUnsafe("<a href="https://localhost/" onclick="2+2" one="two">").]
    expected: FAIL

  [Testcase #7, setHTMLUnsafe("<img src="https://localhost/test-image" onclick="2+2" one="two">").]
    expected: FAIL

  [Testcase #14, setHTMLUnsafe("<svg><script src="https://example.org/"></script></svg>").]
    expected: FAIL

  [Testcase #15, setHTMLUnsafe("<svg><use href="https://example.org/"></use></svg>").]
    expected: FAIL
