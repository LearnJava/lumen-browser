<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Bank ACS stand (tab)</title>
<style>body{font-family:sans-serif;margin:24px}button{font-size:16px;padding:8px}</style></head>
<body>
<h1>Bank verification</h1>
<p>Confirm payment in your bank app, or enter the code.</p>
<input id="otp" placeholder="SMS code" inputmode="numeric">
<button id="confirm" type="button">Confirm</button>
<script>
document.getElementById('confirm').addEventListener('click', function () {
  var card = new URLSearchParams(location.search).get('card') || '';
  if (window.opener) window.opener.postMessage({type: '3ds-done', status: 'Y', card: card}, '*');
});
</script>
</body></html>
