<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Sign in</title>
<style>body{font-family:sans-serif;margin:40px}input,button{font-size:16px;padding:8px;margin:6px 0;display:block}</style></head>
<body>
<h1>Sign in</h1>
<form id="f" onsubmit="return false">
  <div id="step1">
    <label for="email">Email or phone</label>
    <input id="email" name="email" type="email" autocomplete="username">
    <button id="next" type="button">Next</button>
  </div>
  <div id="step2" hidden>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password">
    <button id="signin" type="button">Sign in</button>
  </div>
</form>
<p id="msg"></p>
<script>
document.getElementById('next').addEventListener('click', function () {
  var v = document.getElementById('email').value;
  if (!v) { document.getElementById('msg').textContent = 'Enter an email'; return; }
  document.getElementById('step1').hidden = true;
  document.getElementById('step2').hidden = false;
});
document.getElementById('signin').addEventListener('click', function () {
  location.href = 'login-done.html?u=' + encodeURIComponent(document.getElementById('email').value);
});
</script>
</body></html>
